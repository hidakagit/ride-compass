# CI（docs/improvement-plan.md T1）。push / PR ごとに backend・frontend の全チェックを回す。
#
# - backend: pytest（391件）。PostGIS統合テスト（tests/conftest.py の road_graph_session）は
#   接続先DBが無い場合に自動でskipされる設計のため、CIではDBサービスを立てない。
#   将来、統合テストもCIで回したくなったら postgis/postgis のサービスコンテナを追加し
#   TEST_DATABASE_URL を注入する（conftest.py参照）。
# - frontend: eslint → tsc --noEmit → vitest の順。型エラー・lintは実行の速い順に先へ置き、
#   失敗を早く返す。
# - e2e: クリティカルパス（ルート生成→表示、レイヤー切替）のPlaywrightスモークテスト
#   （改善計画「別の切り口」対応）。バックエンド・外部API（openrouteservice/Open-Meteo/
#   OpenFreeMap）には依存せず、frontend/e2e/fixtures.tsのネットワークモックで置き換える
#   （API契約の正しさはapi-contractジョブが別途担保）。DB・APIキーが不要なため独立ジョブにできる。
name: CI

on:
  push:
    branches: [master]
    # docs/*.mdだけの変更ではコードが動かないため、CIを丸ごとスキップする
    # （GitHub Actions無償枠2000分/月の消費対策。改善計画のdocsのみのコミットが
    # 頻発する運用のため効果が大きい）。
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# 同じブランチ/PRへの新しいpushが来たら、まだ走っている古いコミットのCIを打ち切る
# （無償枠消費対策）。イテレーティブに短い間隔で複数回pushする運用だと、打ち切らない
# 場合は古い実行がそのまま最後まで走り続け、実質使われない分の分数を消費してしまう。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # API契約のドリフト検知（docs/improvement-plan.md T4）。
  # backendのOpenAPIスキーマ→フロント型を再生成し、コミット済みの生成物
  # （frontend/src/types/generated/）と差分が無いことを確認する。
  # 差分が出た場合は、backendのモデル変更に対して
  # backend/scripts/export_openapi.py → cd frontend && npm run generate:api
  # の実行とコミットが漏れている。
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python scripts/export_openapi.py
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/types/generated/

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # dev環境（backend/.venv）と同じ3.12系に固定する
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # dev環境と同じNode 22系に固定する
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps等のNext.jsが生成するグローバル型（.next/types/、tsconfigのincludeに
      # 含まれる）を作る。ローカルはnext devの実行で自然に生成済みだが、CIのクリーン
      # チェックアウトには無く、無いままだとtscが「Cannot find name 'LayoutProps'」で
      # 失敗する（初回CI実行で発覚）。next typegenはフルビルドなしで型だけを生成する。
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 無償枠消費対策: chromium本体をキャッシュし、変わらないバージョンでの再ダウンロードを
      # 省く（--with-depsのOS依存パッケージ部分は毎回軽量に入れ直す必要があるためキャッシュ
      # 対象外、こちらはapt経由で数秒〜十数秒程度に収まる）。package-lock.jsonの
      # @playwright/testバージョンが変わったらキャッシュキーも変わり自動的に再取得する。
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium (with OS deps)
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright OS deps only (browser already cached)
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
