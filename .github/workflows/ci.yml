# CI。masterと並行実行の作業ブランチ（orch/**）へのpush・PRごとに、backend・frontendの全チェックを回す。
#
# - backend: ruff（lint）→ pytest（PostGIS統合テスト込み）。PostGIS統合テスト（tests/conftest.py の
#   road_graph_session）は postgis/postgis サービスコンテナ（docker-compose.ymlと同じイメージ）+
#   TEST_DATABASE_URL 注入で実行する。
# - api-contract: API契約のドリフト検知。DBを読まないため、postgresを持たない別ジョブにして
#   backendジョブと並べて走らせる。
# - frontend: eslint → tsc --noEmit → vitest の順。型エラー・lintは実行の速い順に先へ置き、
#   失敗を早く返す。
# - e2e: クリティカルパス（ルート生成→表示、レイヤー切替）のPlaywrightスモークテスト
#   （改善計画「別の切り口」対応）。バックエンド・外部API（openrouteservice/Open-Meteo/
#   OpenFreeMap）には依存せず、frontend/e2e/fixtures.tsのネットワークモックで置き換える
#   （API契約の正しさはapi-contractジョブが別途担保）。DB・APIキーが不要なため独立ジョブにできる。
name: CI

on:
  push:
    # orch/** は並行実行のエージェントが担当ごとに持つ作業ブランチ（docs/conventions/orchestration.md
    # 「完了とpush」）。重い検査を開発機からここへ移すために回す。
    branches: [master, "orch/**"]
    # docs/**・*.md はこのワークフローのどの検査の入力でもない（テスト・lint・型検査・E2Eは
    # これらを読まない）ため、結果の変わらない実行を起こさない。文書の整合は
    # docs-consistency.yml が別に見る。
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # docker-compose.ymlのpostgresサービスと同じイメージ・認証情報。
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ridecompass
          POSTGRES_PASSWORD: ridecompass
          POSTGRES_DB: ridecompass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # dev環境（backend/.venv）と同じ3.12系に固定する
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-batch.txt
            backend/requirements-dev.txt
      # requirements-batch.txt（-r requirements.txtを内包、+osmium）を入れる。tests/には
      # test_import_pbf.py・test_pbf_source.pyというPBF取込バッチ（app/batch/）専用の
      # テストが存在し無条件でosmiumをimportするため、requirements.txtのみのインストール
      # だとこの2ファイルの収集自体がModuleNotFoundErrorで失敗する（本番Renderデプロイに
      # osmiumが不要という理由でrequirements.txtと分離された経緯とは別の関心事。CIの
      # テスト実行はデプロイ物とは独立なので、ここでosmiumを入れてもRenderへは影響しない）。
      - run: pip install -r requirements-batch.txt
      - run: pip install -r requirements-dev.txt
      # lintはテストより先に置く（frontendジョブがeslint→tsc→vitestの順であるのと同じ、
      # 実行の速いものから）。設定はbackend/ruff.toml。
      - run: python -m ruff check app scripts benchmarks tests
      # -n auto（pytest-xdist、改善計画T233フォローアップ）でCPUコア数ぶん並列化する。
      # PostGIS統合テストは全ファイルxdist_group="postgis"で同一workerへ固定済み
      # （同じridecompass_test DBへの同時TRUNCATEレースを防ぐ、docs/conventions/testing.mdパターン2）
      # なので、それら以外のテストだけが安全に並列化される。上記コメント参照:
      - run: python -m pytest -q -n auto --dist loadgroup

  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # export_openapi.pyはwebアプリの宣言だけをimportするため、取込バッチの追加依存は要らない。
      - run: pip install -r requirements.txt
      # 差分が出た場合は、backendの宣言を変えたのに backend/scripts/export_openapi.py →
      # cd frontend && npm run generate:api の実行とコミットが漏れている。**生成物はすべてコードの宣言から決まり、DBを読まない**
      # ——軸定義はDBが正本で、実行時の GET /api/axis-catalog が配る。
      - run: python scripts/export_openapi.py
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      # working-directoryはリポジトリルートを明示する。ジョブ既定（backend）のままだと
      # pathspecが`backend/frontend/src/types/generated/`へ解決され、マッチ0件＝差分なしと
      # して常にexit 0になり、ドリフトを一切検知しない。
      - run: git diff --exit-code -- frontend/src/types/generated/
        working-directory: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps等のNext.jsが生成するグローバル型（.next/types/、tsconfigのincludeに
      # 含まれる）を作る。ローカルはnext devの実行で自然に生成済みだが、CIのクリーン
      # チェックアウトには無く、無いままだとtscが「Cannot find name 'LayoutProps'」で
      # 失敗する（初回CI実行で発覚）。next typegenはフルビルドなしで型だけを生成する。
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
