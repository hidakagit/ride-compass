# CI（docs/improvement-plan.md T1）。push / PR ごとに backend・frontend の全チェックを回す。
#
# - backend: pytest（391件）。PostGIS統合テスト（tests/conftest.py の road_graph_session）は
#   接続先DBが無い場合に自動でskipされる設計のため、CIではDBサービスを立てない。
#   将来、統合テストもCIで回したくなったら postgis/postgis のサービスコンテナを追加し
#   TEST_DATABASE_URL を注入する（conftest.py参照）。
# - frontend: eslint → tsc --noEmit → vitest の順。型エラー・lintは実行の速い順に先へ置き、
#   失敗を早く返す。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # dev環境（backend/.venv）と同じ3.12系に固定する
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # dev環境と同じNode 22系に固定する
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
