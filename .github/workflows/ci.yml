# CI。masterと作業ブランチ（orch/**）へのpush・PRごとに、backend・frontendの全チェックを回す。
#
# - backend: ruff（lint）→ mypy（型検査）→ pytest（PostGIS統合テスト込み）。PostGIS統合テスト（tests/conftest.py の
#   road_graph_session）は、ランナーへ直接入れたPostgreSQL＋PostGIS + TEST_DATABASE_URL 注入で実行する。
# - api-contract: API契約のドリフト検知。DBを読まないため、postgresを持たない別ジョブにして
#   backendジョブと並べて走らせる。
# - frontend: prettier → eslint → knip → tsc --noEmit → vitest の順。書式・lint・型エラーは実行の速い順に
#   先へ置き、失敗を早く返す。knipは本番・テスト・e2eの入口から辿れないファイル・export・依存を見る。
# - e2e: 本番ビルドを実ブラウザで開き、実機でしか出ないもの（収まる・押せる、ブラウザと地図の
#   実挙動、カスケード）を見る（対象の定義は docs/conventions/testing.md パターン4）。
#   バックエンド・外部APIには依存せず、frontend/e2e/fixtures.tsのネットワークモックで置き換える
#   （API契約の正しさはapi-contractジョブが別途担保）。DB・APIキーが不要なため独立ジョブにできる。
# - e2e-scan: e2eのうち全状態の走査を、幅ごとの別ジョブで走らせる（1本の中で画面の状態を辿るため、
#   分けられる単位は幅）。
# - changes: 変更されたパスから、重い検査（backend〜e2e-scan）を走らせるかを決める。文書（docs/**・*.md）・
#   Claude Codeの設定（.claude/**）・運用の道具（scripts/ のうちテストとデプロイが読まないもの）だけの変更では
#   走らせない。飛ばしてよいのは、このワークフローの検査が読まないものだけで、読む範囲がディレクトリに限られる
#   検査は、そのディレクトリを先に当てて入れ直す（frontend/src/structure/caseOnlyPaths.test.ts は frontend/src の下の
#   .md も読む）。全ての文書を読む検査（backend/tests/structure/test_named_references.py）と運用の道具の静的検査は、
#   常に走る docs-consistency.yml が持つ。決め方は docs/architecture/tech-stack.md「CIの実行枠」。
# - ci-ok: コードのリポジトリの必須チェックに置く1本。上のどれかが失敗・取り消しなら落ち、スキップは通す
#   （必須にするのをこの1本にまとめると、ジョブを足し引きしても必須チェックの設定を変えずに済む）。
# - deploy-gate: masterへのpushで ci-ok が通り、tools/flow-gate/ が変わっていれば、ゲートを Cloudflare へ公開する。
# - deploy-backend: masterへのpushで上の全ジョブが通ったときだけ、backendを本番へ出す
#   （出すかの判定と手順は deploy-backend.yml）。**本番へ出る前の検査はこのワークフロー**で、
#   どれかが赤ならデプロイは起動しない。
name: CI

on:
  push:
    # orch/** はmasterへ入れる前の作業ブランチ。重い検査を開発機からここへ移すために回す。
    branches: [master, "orch/**"]
  # ワークフローはいつも起こし、重い検査を走らせるかは changes ジョブが変更されたパスから決める
  # （必須チェックは、ワークフローごと飛ばすと Pending のまま残り Pull Request がマージできない。
  # ジョブの if で飛ばしたものはスキップになり、必須チェックを通る。GitHub の公式の文書
  # 「Troubleshooting required status checks」）。
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 比べる相手が無い（手での実行・新しい枝の最初の push）ときは、すべて走らせる。
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}"; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          heavy=false
          while IFS= read -r f; do
            case "$f" in
              frontend/src/*) heavy=true ;;
              docs/*|*.md|.claude/*|scripts/heavy.py|scripts/review_checks.py|scripts/size_thresholds.json|scripts/remote_dev/*) ;;
              *) heavy=true ;;
            esac
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    # 本番（Oracle Cloud VMのAmpere A1）と同じaarch64・同じUbuntu 24.04で判定する。版の正本は
    # docs/architecture/tech-stack.md「DBの版」。
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
    steps:
      - uses: actions/checkout@v5
      # 本番と同じ配布元（PostgreSQL公式のaptリポジトリ）から同じパッケージを入れる。GEOS・PROJも
      # PGDGの版（本番もPGDGの版を使っている）。
      # postgis/postgisのイメージはamd64しか配っていないため、arm64ではサービスコンテナにできない。
      # ランナーに入っている別の版のクラスタは5432番を塞ぐため、先に落とす。
      - name: PostgreSQL + PostGIS（本番と同じ版）
        run: |
          pg_lsclusters -h | while read -r ver name _; do sudo pg_dropcluster --stop "$ver" "$name"; done
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-18-postgis-3
          sudo pg_ctlcluster 18 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ridecompass LOGIN SUPERUSER PASSWORD 'ridecompass'"
          sudo -u postgres createdb -O ridecompass ridecompass_test
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d ridecompass_test -c "CREATE EXTENSION postgis" -c "CREATE EXTENSION postgis_raster"
          echo "::notice title=DB::$(sudo -u postgres psql -d ridecompass_test -Atc "SELECT version() || ' / PostGIS ' || postgis_lib_version() || ' / GEOS ' || postgis_geos_version() || ' / PROJ ' || split_part(postgis_proj_version(), ' ', 1) || ' / ' || postgis_gdal_version()")"
      - uses: actions/setup-python@v6
        with:
          # 本番のイメージ（backend/Dockerfile）と同じ3.12系に固定する
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-batch.txt
            backend/requirements-dev.txt
      # requirements-batch.txt（-r requirements.txtを内包、+osmium）を入れる。tests/には
      # test_import_pbf.py・test_pbf_source.pyというPBF取込バッチ（app/batch/）専用の
      # テストが存在し無条件でosmiumをimportするため、requirements.txtのみのインストール
      # だとこの2ファイルの収集自体がModuleNotFoundErrorで失敗する（本番Renderデプロイに
      # osmiumが不要という理由でrequirements.txtと分離された経緯とは別の関心事。CIの
      # テスト実行はデプロイ物とは独立なので、ここでosmiumを入れてもRenderへは影響しない）。
      - run: pip install -r requirements-batch.txt
      - run: pip install -r requirements-dev.txt
      # lintはテストより先に置く（frontendジョブがeslint→tsc→vitestの順であるのと同じ、
      # 実行の速いものから）。設定はbackend/ruff.toml。対象はbackendの下のPythonすべてで、backendの外は
      # docs-consistency.ymlが見る。
      - run: python -m ruff check .
      # 関数の宣言と違う型の値を渡す呼び出しを止める。対象と設定はbackend/mypy.ini。
      - run: python -m mypy
      # 層の向き（上の層だけが下の層を読む）を止める。契約はbackend/.importlinter、各層が持つものは
      # docs/architecture/directory-layout.md。
      - run: lint-imports
      # -n auto（pytest-xdist、改善計画T233フォローアップ）でCPUコア数ぶん並列化する。
      # PostGIS統合テストは全ファイルxdist_group="postgis"で同一workerへ固定済み
      # （同じridecompass_test DBへの同時TRUNCATEレースを防ぐ、docs/conventions/testing.mdパターン2）
      # なので、それら以外のテストだけが安全に並列化される。上記コメント参照:
      # 実行順はpytest-randomlyがばらす。-qでは種が見出しに出ないため、runのIDを種に渡す——落ちた並びは
      # 手元で --randomly-seed=<runのID> を付けて同じ順に並べ直せる。
      - run: python -m pytest -q -n auto --dist loadgroup --randomly-seed=${{ github.run_id }}

  api-contract:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # export_openapi.pyはwebアプリの宣言だけをimportするため、取込バッチの追加依存は要らない。
      - run: pip install -r requirements.txt
      # 差分が出た場合は、backendの宣言を変えたのに backend/scripts/export_openapi.py →
      # cd frontend && npm run generate:api の実行とコミットが漏れている。**生成物はすべてコードの宣言から決まり、DBを読まない**
      # ——軸定義はDBが正本で、実行時の GET /api/axis-catalog が配る。
      - run: python scripts/export_openapi.py
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      # working-directoryはリポジトリルートを明示する。ジョブ既定（backend）のままだと
      # pathspecが`backend/frontend/src/types/generated/`へ解決され、マッチ0件＝差分なしと
      # して常にexit 0になり、ドリフトを一切検知しない。
      - run: git diff --exit-code -- frontend/src/types/generated/
        working-directory: .

  frontend:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 書式。設定はfrontend/.prettierrc.json・.prettierignore（生成物は外してある）。
      - run: npm run format:check
      - run: npm run lint
      # 入口（Next.jsの規約・vitest・Playwrightの設定・scripts）はknipが読み、足りない入口は frontend/knip.json が持つ。
      - run: npm run knip
      # LayoutProps等のNext.jsが生成するグローバル型（.next/types/、tsconfigのincludeに
      # 含まれる）を作る。ローカルはnext devの実行で自然に生成済みだが、CIのクリーン
      # チェックアウトには無く、無いままだとtscが「Cannot find name 'LayoutProps'」で
      # 失敗する（初回CI実行で発覚）。next typegenはフルビルドなしで型だけを生成する。
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 全状態の走査は、下のe2e-scanが幅ごとの別ジョブで走らせる。
      - run: npm run test:e2e -- --grep-invert "全状態の走査"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
  # 全状態の走査（frontend/e2e/all-states.spec.ts）を幅ごとに別のジョブで走らせる。
  e2e-scan:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        width: [mobile, desktop]
    name: e2e-scan (${{ matrix.width }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run test:e2e -- -g "全状態の走査: ${{ matrix.width }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-scan-${{ matrix.width }}
          path: frontend/playwright-report/
          retention-days: 7
  # タスク管理のゲート（tools/flow-gate/）。依存するパッケージが無いので npm ci は要らない。
  flow-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tools/flow-gate/test/*.test.js
  ci-ok:
    needs: [changes, backend, api-contract, frontend, e2e, e2e-scan, flow-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
  # タスクの流れのゲート（tools/flow-gate/）を、master に入ったら公開する（Cloudflare の公式の wrangler-action）。
  # 公開の直後に、本文の先頭に残る前の形の問いを今の形へ直す（前の形が無ければ何もしない）。
  deploy-gate:
    needs: [ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" || git diff --name-only "$BEFORE" "$GITHUB_SHA" -- tools/flow-gate | grep -q .; then
            echo "gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.gate == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/flow-gate
          command: deploy
      - if: steps.diff.outputs.gate == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/flow-gate
          command: deploy --env form
      - if: steps.diff.outputs.gate == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: steps.diff.outputs.gate == 'true'
        env:
          FLOW_BOT_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
        run: node tools/flow-gate/bin/migrate-questions.js
  deploy-backend:
    needs: [backend, api-contract, frontend, e2e, e2e-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit
