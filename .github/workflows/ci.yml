# CI（docs/improvement-plan.md T1）。push / PR ごとに backend・frontend の全チェックを回す。
#
# - backend: pytest（PostGIS統合テスト込み）→ API契約のドリフト検知（改善計画T4）の順で
#   1ジョブにまとめている（改善計画T350のcode-review対応で統合、2026-08-27。ジョブ分割時は
#   postgresサービスコンテナがジョブごとに独立起動しGitHub Actions無償枠を余計に消費する
#   ため）。PostGIS統合テスト（tests/conftest.py の road_graph_session）は postgis/postgis
#   サービスコンテナ（docker-compose.ymlと同じイメージ）+ TEST_DATABASE_URL 注入で実行する
#   （改善計画T233、consistencyレビュー2026-08-23 F-1: 統合テスト約100件がCIで一度も検証
#   されず、T224の回帰テスト自身もその中に含まれていたことが発覚したため追加）。
#   API契約チェック（export_openapi.py）は同じコンテナに対しmigration適用後の状態で行う
#   （ステップ順序の制約はbackendジョブ内のコメント参照——pytestより後に実行必須）。
# - frontend: eslint → tsc --noEmit → vitest の順。型エラー・lintは実行の速い順に先へ置き、
#   失敗を早く返す。
# - e2e: クリティカルパス（ルート生成→表示、レイヤー切替）のPlaywrightスモークテスト
#   （改善計画「別の切り口」対応）。バックエンド・外部API（openrouteservice/Open-Meteo/
#   OpenFreeMap）には依存せず、frontend/e2e/fixtures.tsのネットワークモックで置き換える
#   （API契約の正しさはbackendジョブが別途担保）。DB・APIキーが不要なため独立ジョブにできる。
name: CI

on:
  push:
    branches: [master]
    # docs/*.mdだけの変更ではコードが動かないため、CIを丸ごとスキップする
    # （GitHub Actions無償枠2000分/月の消費対策。改善計画のdocsのみのコミットが
    # 頻発する運用のため効果が大きい）。
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# 同じブランチ/PRへの新しいpushが来たら、まだ走っている古いコミットのCIを打ち切る
# （無償枠消費対策）。イテレーティブに短い間隔で複数回pushする運用だと、打ち切らない
# 場合は古い実行がそのまま最後まで走り続け、実質使われない分の分数を消費してしまう。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # backend単体テスト（PostGIS統合テスト込み）＋API契約のドリフト検知（改善計画T4）を
  # 1ジョブに統合（改善計画T350のcode-review対応、2026-08-27）。
  #
  # 統合の背景: T350でaxis_definitions.pyのAXIS_DEFINITIONS（Python literal）を撤去し
  # axis_definitionsテーブルが14軸全ての唯一の正本になったことで、API契約チェック
  # （backend/scripts/export_openapi.py）にも実DB＋migration適用が必須になった。
  # 当初はapi-contractジョブへ専用のpostgresサービスコンテナを別途追加したが、
  # code-reviewで「backendジョブと2つの独立したpostgresコンテナが並行起動し、
  # GitHub Actions無償枠を不必要に消費している」と指摘され、1つのジョブ・1つの
  # コンテナへ統合した。
  #
  # ステップ順序の制約（重要）: pytestの実行を必ずmigration適用（scripts/
  # bootstrap_ci_db.py）より先に行うこと。tests/test_health.pyの
  # test_db_status_returns_table_row_counts_and_import_run_status_for_empty_test_dbは
  # 「ridecompass_test DBがBase.metadata.create_allのみでapply_pending_migrationsを
  # 経由していない（＝migration未適用）」状態を前提にpending_migrationsが非空である
  # ことを検証している。先にbootstrap_ci_db.pyでmigrationを適用してしまうと、
  # このテストが常に失敗するようになる（ローカルで実際に再現・確認済み）。
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # docker-compose.ymlのpostgresサービスと同じイメージ・認証情報。
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ridecompass
          POSTGRES_PASSWORD: ridecompass
          POSTGRES_DB: ridecompass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # dev環境（backend/.venv）と同じ3.12系に固定する
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-batch.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # requirements-batch.txt（-r requirements.txtを内包、+osmium）を入れる。tests/には
      # test_import_pbf.py・test_pbf_source.pyというPBF取込バッチ（app/batch/）専用の
      # テストが存在し無条件でosmiumをimportするため、requirements.txtのみのインストール
      # だとこの2ファイルの収集自体がModuleNotFoundErrorで失敗する（本番Renderデプロイに
      # osmiumが不要という理由でrequirements.txtと分離された経緯とは別の関心事。CIの
      # テスト実行はデプロイ物とは独立なので、ここでosmiumを入れてもRenderへは影響しない）。
      - run: pip install -r requirements-batch.txt
      # -n auto（pytest-xdist、改善計画T233フォローアップ）でCPUコア数ぶん並列化する。
      # PostGIS統合テストは全ファイルxdist_group="postgis"で同一workerへ固定済み
      # （同じridecompass_test DBへの同時TRUNCATEレースを防ぐ、docs/testing.mdパターン2）
      # なので、それら以外のテストだけが安全に並列化される。上記コメント参照:
      # このステップは必ずbootstrap_ci_db.py（次のステップ）より先に実行すること。
      - run: python -m pytest -q -n auto --dist loadgroup
      # ここから改善計画T4のAPI契約ドリフト検知（旧api-contractジョブ）。
      # 差分が出た場合は、backendのモデル変更に対して
      # backend/scripts/export_openapi.py → cd frontend && npm run generate:api
      # の実行とコミットが漏れている。
      - run: python scripts/bootstrap_ci_db.py
      - run: python scripts/export_openapi.py
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/types/generated/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # dev環境と同じNode 22系に固定する
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps等のNext.jsが生成するグローバル型（.next/types/、tsconfigのincludeに
      # 含まれる）を作る。ローカルはnext devの実行で自然に生成済みだが、CIのクリーン
      # チェックアウトには無く、無いままだとtscが「Cannot find name 'LayoutProps'」で
      # 失敗する（初回CI実行で発覚）。next typegenはフルビルドなしで型だけを生成する。
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 無償枠消費対策: chromium本体をキャッシュし、変わらないバージョンでの再ダウンロードを
      # 省く（--with-depsのOS依存パッケージ部分は毎回軽量に入れ直す必要があるためキャッシュ
      # 対象外、こちらはapt経由で数秒〜十数秒程度に収まる）。package-lock.jsonの
      # @playwright/testバージョンが変わったらキャッシュキーも変わり自動的に再取得する。
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium (with OS deps)
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright OS deps only (browser already cached)
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
