# CI。masterへのpushとPull Requestごとに、backend・frontendの全チェックを回す。
#
# - backend: ruff（lint）→ mypy（型検査）→ pytest（PostGIS統合テスト込み）。PostGIS統合テスト（tests/conftest.py の
#   road_graph_session）は、ランナーへ直接入れたPostgreSQL＋PostGIS + TEST_DATABASE_URL 注入で実行する。
# - api-contract: API契約のドリフト検知。DBを読まないため、postgresを持たない別ジョブにして
#   backendジョブと並べて走らせる。
# - frontend: prettier → eslint → knip → tsc --noEmit → vitest の順。書式・lint・型エラーは実行の速い順に
#   先へ置き、失敗を早く返す。knipは本番・テスト・e2eの入口から辿れないファイル・export・依存を見る。
# - e2e: 本番ビルドを実ブラウザで開き、実機でしか出ないもの（収まる・押せる、ブラウザと地図の
#   実挙動、カスケード）を見る（対象の定義は docs/conventions/testing.md パターン4）。
#   バックエンド・外部APIには依存せず、frontend/e2e/fixtures.tsのネットワークモックで置き換える
#   （API契約の正しさはapi-contractジョブが別途担保）。DB・APIキーが不要なため独立ジョブにできる。
# - e2e-scan: e2eのうち全状態の走査を、幅ごとの別ジョブで走らせる（1本の中で画面の状態を辿るため、
#   分けられる単位は幅）。
# - changes: 変更されたパスから、重い検査（backend〜e2e-scan）を走らせるかを決める。文書（docs/**・*.md）・
#   Claude Codeの設定（.claude/**）・運用の道具（scripts/ のうちテストとデプロイが読まないもの）・タスク管理
#   （.github/taskflow-paths の置き場。検査と公開は claude-gate.yml）だけの変更では走らせない。飛ばしてよいのは、
#   このワークフローの検査が読まないものだけで、読む範囲がディレクトリに限られる検査は、そのディレクトリを先に当てて
#   入れ直す（frontend/src/structure/caseOnlyPaths.test.ts は frontend/src の下の .md も読む）。全ての文書を読む検査（backend/tests/structure/test_named_references.py）と運用の道具の静的検査は、
#   常に走る docs-consistency.yml が持つ。決め方は docs/architecture/tech-stack.md「CIの実行枠」。
# - ci-ok: コードのリポジトリの必須チェックに置く1本。changes が成功し、重い検査が changes の決めたとおりに
#   終わった（走らせるなら全部成功、飛ばすなら全部スキップ）ときだけ通し、それ以外は落とす。通す形を列挙するのは、
#   GitHub Actions の障害でランナーが付かずに取り消されたジョブが、needs の結果に cancelled として渡らないことがあるため
#   （失敗・取り消しを探す形では、それを見逃して通した）。
#   （必須にするのをこの1本にまとめると、ジョブを足し引きしても必須チェックの設定を変えずに済む）。
# - deploy-backend・deploy-frontend: masterへのpushで上の全ジョブが通ったときだけ、backend・frontendを本番へ出す
#   （出すかの判定と手順は deploy-backend.yml・deploy-frontend.yml）。**本番へ出る前の検査はこのワークフロー**で、
#   どれかが赤ならデプロイは起動しない。
# - 持ち時間（各ジョブの timeout-minutes）: 2026-10-07 に測った成功した実行（masterへのpushの直近20件と
#   Pull Requestの直近60件）の、ジョブごとの最長の所要の2倍を5分単位へ切り上げた値（e2e-scan は幅のうち長いほう）。
#   段が止まったジョブ（playwright install が進まなくなった等）を既定の360分まで待たせず、取り消しで終わらせて、
#   作る担当・確かめる担当が流し直す（tools/flow-gate/src/rerun.js）。成功する実行が切られるようになったら、同じ決め方で
#   測り直す。deploy-backend・deploy-frontend の持ち時間は、呼ばれる側の deploy-*.yml が持つ。
name: CI

on:
  push:
    # 作業ブランチ（orch/**）へのpushでは走らせない。masterへ入れてよいかはPull Requestの実行
    # （masterと合わせた版）で決める。
    branches: [master]
  # ワークフローはいつも起こし、重い検査を走らせるかは changes ジョブが変更されたパスから決める
  # （必須チェックは、ワークフローごと飛ばすと Pending のまま残り Pull Request がマージできない。
  # ジョブの if で飛ばしたものはスキップになり、必須チェックを通る。GitHub の公式の文書
  # 「Troubleshooting required status checks」）。
  pull_request:
  workflow_dispatch:

# 同じ ref（master・Pull Request ごと）の実行は1本ずつ動かし、待ちは一番新しい1件だけにする（既定の queue: single。
# 新しい実行が来ると古い待ちは取り消される。GitHub の公式の文書「Control the concurrency of workflows and jobs」）。
# 後のコミットは前の変更を全部含むので、古いコミットの実行は要らない。Pull Request は走っている実行も取り消し、
# master は走っている実行を最後まで走らせる（デプロイは同じ実行の中で走るので、途中で切らない）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # master の実行の一覧を読む（下の BASE）。
    permissions:
      contents: read
      actions: read
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # master の push は、直前のコミット（github.event.before）でなく、master の祖先のうち push の実行が成功で
          # 終わった一番近いコミットと比べる。直前のコミットの実行が失敗で終わったか、待ちのまま取り消された
          # （concurrency）とき、その変更は検査もデプロイもされていないので、この実行の判定に入れる。
          # 一覧の並びは公式の文書に無いので、並びに頼らず祖先の側から辿る（見つからなければすべて走らせる）。
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=100" --jq '.workflow_runs[].head_sha') || ok=""
            BASE=$(git rev-list --first-parent --skip=1 "$GITHUB_SHA" | awk 'NR == FNR { ok[$0] = 1; next } !found && ($0 in ok) { print; found = 1 }' <(printf '%s\n' "$ok") -)
            echo "比べる相手: ${BASE:-無し}"
          fi
          # 比べる相手が無い（手での実行・成功した master の実行が見つからない）ときは、すべて走らせる。
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}"; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mapfile -t taskflow < <(grep -Ev '^(#|[[:space:]]*$)' .github/taskflow-paths)
          heavy=false
          while IFS= read -r f; do
            case "$f" in
              frontend/src/*) heavy=true; continue ;;
              docs/*|*.md|.claude/*|scripts/size_thresholds.json|scripts/remote_dev/*) continue ;;
            esac
            skip=false
            for p in "${taskflow[@]}"; do [[ "$f" == "$p"* ]] && skip=true; done
            $skip || heavy=true
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    # 本番（Oracle Cloud VMのAmpere A1）と同じaarch64・同じUbuntu 24.04で判定する。版の正本は
    # docs/architecture/tech-stack.md「DBの版」。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/postgis
      - uses: actions/setup-python@v6
        with:
          # 本番のイメージ（backend/Dockerfile）と同じ3.12系に固定する
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-batch.txt
            backend/requirements-dev.txt
      # requirements-batch.txt（-r requirements.txtを内包し、取込バッチの依存を足す）を入れる。
      # 本番のイメージ（backend/Dockerfile）と同じ組で、tests/には取込バッチ（app/batch/）の
      # テストがあり無条件でosmiumをimportするため、requirements.txtだけでは収集で失敗する。
      - run: pip install -r requirements-batch.txt
      - run: pip install -r requirements-dev.txt
      # lintはテストより先に置く（frontendジョブがeslint→tsc→vitestの順であるのと同じ、
      # 実行の速いものから）。設定はbackend/ruff.toml。対象はbackendの下のPythonすべてで、backendの外は
      # docs-consistency.ymlが見る。
      - run: python -m ruff check .
      # 関数の宣言と違う型の値を渡す呼び出しを止める。対象と設定はbackend/mypy.ini。
      - run: python -m mypy
      # 層の向き（上の層だけが下の層を読む）を止める。契約はbackend/.importlinter、各層が持つものは
      # docs/architecture/directory-layout.md。
      - run: lint-imports
      # -n auto（pytest-xdist）でCPUコア数ぶん並列化する。
      # PostGIS統合テストは全ファイルxdist_group="postgis"で同一workerへ固定済み
      # （同じridecompass_test DBへの同時TRUNCATEレースを防ぐ、docs/conventions/testing.mdパターン2）
      # なので、それら以外のテストだけが安全に並列化される。上記コメント参照:
      # 実行順はpytest-randomlyがばらす。-qでは種が見出しに出ないため、runのIDを種に渡す——落ちた並びは
      # 手元で --randomly-seed=<runのID> を付けて同じ順に並べ直せる。
      - run: python -m pytest -q -n auto --dist loadgroup --randomly-seed=${{ github.run_id }}

  api-contract:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # export_openapi.pyはwebアプリの宣言だけをimportするため、取込バッチの追加依存は要らない。
      - run: pip install -r requirements.txt
      # 差分が出た場合は、backendの宣言を変えたのに backend/scripts/export_openapi.py →
      # cd frontend && npm run generate:api の実行とコミットが漏れている。**生成物はすべてコードの宣言から決まり、DBを読まない**
      # ——軸定義はDBが正本で、実行時の GET /api/axis-catalog が配る。
      - run: python scripts/export_openapi.py
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      # working-directoryはリポジトリルートを明示する。ジョブ既定（backend）のままだと
      # pathspecが`backend/frontend/src/types/generated/`へ解決され、マッチ0件＝差分なしと
      # して常にexit 0になり、ドリフトを一切検知しない。
      - run: git diff --exit-code -- frontend/src/types/generated/
        working-directory: .

  frontend:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 書式。設定はfrontend/.prettierrc.json・.prettierignore（生成物は外してある）。
      - run: npm run format:check
      - run: npm run lint
      # 入口（Next.jsの規約・vitest・Playwrightの設定・scripts）はknipが読み、足りない入口は frontend/knip.json が持つ。
      - run: npm run knip
      # LayoutProps等のNext.jsが生成するグローバル型（.next/types/、tsconfigのincludeに
      # 含まれる）を作る。ローカルはnext devの実行で自然に生成済みだが、CIのクリーン
      # チェックアウトには無く、無いままだとtscが「Cannot find name 'LayoutProps'」で
      # 失敗する。next typegenはフルビルドなしで型だけを生成する。
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 全状態の走査は、下のe2e-scanが幅ごとの別ジョブで走らせる。
      - run: npm run test:e2e -- --grep-invert "全状態の走査"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
  # 全状態の走査（frontend/e2e/all-states.spec.ts）を幅ごとに別のジョブで走らせる。
  e2e-scan:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        width: [mobile, desktop]
    name: e2e-scan (${{ matrix.width }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run test:e2e -- -g "全状態の走査: ${{ matrix.width }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-scan-${{ matrix.width }}
          path: frontend/playwright-report/
          retention-days: 7
  ci-ok:
    needs: [changes, backend, api-contract, frontend, e2e, e2e-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS"
          jq -e '(.changes.outputs.heavy | if . == "true" then "success" elif . == "false" then "skipped" else null end) as $want
            | .changes.result == "success" and $want != null and ([del(.changes)[].result] | all(. == $want))' <<< "$NEEDS"
  deploy-backend:
    needs: [backend, api-contract, frontend, e2e, e2e-scan]
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit
  deploy-frontend:
    needs: [backend, api-contract, frontend, e2e, e2e-scan]
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
