# 担当（作る・確かめる）を1件、GitHub Actions のランナーで動かす。振り出し（claude-dispatch.yml）が起こす。手でも起こせる:
#   gh workflow run claude-task.yml -R hidakagit/ride-compass -f issue=<置き場の issue の番号> -f kind=<作る|確かめる>
# 担当は docs/conventions/flow.md の「作る担当」「確かめる担当」の手順を進める。
# このリポジトリは公開で、Actions の記録は誰でも読める。担当の出力の全文（show_full_output）と報告（display_report）は出さない。
name: Claude Task
# 振り出しは、この名前から動いている担当の issue の番号を読む（tools/flow-gate/src/dispatch.js: runIssue）。
run-name: "#${{ inputs.issue }} ${{ inputs.kind }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 置き場（ridecompass/ride-compass-tasks）の issue の番号
        required: true
      kind:
        description: 担当の種類
        required: true
        type: choice
        options: [作る, 確かめる]

permissions:
  contents: read

# 同じ issue の担当は1本ずつ。重ねて起こされた2本目は、1本目が終わってから最初の段で照らされて何もせず終わる。
concurrency:
  group: claude-task-${{ inputs.issue }}

jobs:
  task:
    # backend のテストを CI（ci.yml の backend）と同じ aarch64・同じ PostgreSQL + PostGIS で流せるようにする。
    runs-on: ubuntu-24.04-arm
    # 担当の持ち時間。超えると Actions がジョブを止め、最後の段（後始末）が落ちたものとして扱う。
    timeout-minutes: 240
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      # 置き場へ書く道具（tools/flow-gate/bin/token.js）は hidakagit-bot、コードのリポジトリの gh は hidakagit の名義。
      # マージを GITHUB_TOKEN で打つと master の CI とデプロイが起きないので、hidakagit のトークンで打つ。
      FLOW_BOT_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.CODE_TOKEN }}
      ISSUE: ${{ inputs.issue }}
      KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 作るなら振り出しの遷移（未着手 → 進行中）が通ったときだけ、確かめるなら検証中のときだけ進む。
      - name: 引き受ける
        id: claim
        run: |
          if [ "$KIND" = "作る" ]; then
            if node tools/flow-gate/bin/move.js "$ISSUE" 振り出し; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "未着手ではないので、作らずに終わる"; fi
          elif node tools/flow-gate/bin/queue.js --json | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>process.exit(JSON.parse(t).some(q=>q.number===Number(process.env.ISSUE)&&q.status==="検証中")?0:1))'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "検証中ではないので、確かめずに終わる"
          fi
      - name: PostgreSQL + PostGIS（ci.yml の backend と同じ）
        if: steps.claim.outputs.go == 'true'
        run: |
          pg_lsclusters -h | while read -r ver name _; do sudo pg_dropcluster --stop "$ver" "$name"; done
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-18-postgis-3
          sudo pg_ctlcluster 18 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ridecompass LOGIN SUPERUSER PASSWORD 'ridecompass'"
          sudo -u postgres createdb -O ridecompass ridecompass_test
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d ridecompass_test -c "CREATE EXTENSION postgis" -c "CREATE EXTENSION postgis_raster"
      - uses: actions/setup-python@v6
        if: steps.claim.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-batch.txt
            backend/requirements-dev.txt
      - if: steps.claim.outputs.go == 'true'
        run: pip install -r requirements-batch.txt -r requirements-dev.txt
        working-directory: backend
      - if: steps.claim.outputs.go == 'true'
        run: npm ci
        working-directory: frontend
      - name: git の名義
        if: steps.claim.outputs.go == 'true'
        run: |
          git config --global user.name hidakagit
          git config --global user.email 6731891+hidakagit@users.noreply.github.com
      # 許可の行（.claude/settings.json の permissions）だけを渡す。連携は settings をユーザー設定へ混ぜて書き、ユーザー設定は
      # フォルダの信頼に関係なく読まれる（プロジェクトの設定は、信頼していないフォルダでは許可の行が読み飛ばされる）。
      - name: 許可の行
        if: steps.claim.outputs.go == 'true'
        run: node -e 'const s=require("./.claude/settings.json"); require("fs").writeFileSync(process.env.RUNNER_TEMP+"/permissions.json", JSON.stringify({permissions:s.permissions}))'
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.claim.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CODE_TOKEN }}
          settings: ${{ runner.temp }}/permissions.json
          claude_args: --permission-mode auto --model claude-opus-5-5
          prompt: |
            あなたは RideCompass の${{ inputs.kind }}担当です。作業ツリー ${{ github.workspace }} で、置き場 ridecompass/ride-compass-tasks の issue #${{ inputs.issue }} を扱います。
            まず CLAUDE.md と docs/conventions/flow.md の「担当」「${{ inputs.kind }}担当」「問い」「issue の形」を読み、その手順のとおりに進めてください。
            ここは GitHub Actions のランナーです。backend の依存は `python` に、frontend の依存は frontend/node_modules に入っていて、PostgreSQL + PostGIS のテスト用 DB（TEST_DATABASE_URL）も動いています。開発 DB の実データと本番への調べ（run_probe.py）は無いので、それが要ると分かったら flow.md「開発機が要る」のとおりにしてください。
            作業はこの作業ツリーの中だけで行い、終わるときは手順のとおり push と issue への報告をして終えてください。次の担当を起こすことには触れないでください。すべて日本語で書いてください。
      # 作る担当の GitHub に無い変更は、マシンと一緒に消えないよう wip の枝へ残す（作業ブランチは書き換えない）。
      - name: 残った変更
        if: always() && steps.claim.outputs.go == 'true' && inputs.kind == '作る'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -q -m "tasks#${ISSUE}: 作業途中（作る担当の終わりに残った未コミットの変更）"
          fi
          git fetch -q origin
          if [ -z "$(git branch -r --contains HEAD)" ]; then
            wip="wip/tasks-${ISSUE}-$(date -u +%Y%m%dT%H%M%SZ)"
            git push -q origin "HEAD:refs/heads/${wip}"
            echo "GitHub に無い変更を ${wip} へ残した"
          fi
      # 担当の外の失敗（利用の上限・認証・サーバー）ならタスクを未着手へ戻し、上限・認証なら振り出しをしばらく止める。
      # それ以外で作る担当のタスクが進行中のままなら、落ちたとして保留にする（tools/flow-gate/bin/after.js）。
      - name: 後始末
        if: always() && steps.claim.outputs.go == 'true'
        run: node tools/flow-gate/bin/after.js "$ISSUE" "$KIND" "${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "${{ job.status }}"
