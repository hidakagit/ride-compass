# 担当（作る・確かめる）を1件、GitHub Actions のランナーで動かす。見回りが振り出す（tools/flow-gate/src/patrol.js）。手でも起こせる:
#   gh workflow run claude-task.yml -R ridecompass/ride-compass -f issue=<置き場の issue の番号> -f kind=<作る|確かめる>
# 担当は .claude/skills/task-work/SKILL.md の手順を進め、ステータスは書かない（実行の始まりと終わりの出来事で、ゲートが決める）。
# このワークフローを無効にすると、見回りは振り出さない（止める操作）。リポジトリは公開なので、担当の出力の全文は記録に出さない。
name: Claude Task
# 見回りは、この名前からどのタスクのどの担当の、どの振り出しの実行かを読む（tools/flow-gate/src/facts.js: runOf）。
run-name: "#${{ inputs.issue }} ${{ inputs.kind }} ${{ inputs.key }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 置き場（ridecompass/ride-compass-tasks）の issue の番号
        required: true
      kind:
        description: 担当の種類
        required: true
        type: choice
        options: [作る, 確かめる]
      key:
        description: 振り出しの識別子（見回りが付ける。手で起こすときは空でよい）
        required: false

permissions:
  contents: read

# 1つのタスクの担当は1人。同じ issue の実行は、取り消さずに順に動く。
concurrency:
  group: claude-task-${{ inputs.issue }}
  queue: max

jobs:
  task:
    # backend のテストを CI と同じ aarch64・同じ PostgreSQL + PostGIS で流す。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      # 置き場へは hidakagit-bot、コードのリポジトリの gh は hidakagit の名義（GITHUB_TOKEN のマージは master の CI とデプロイを起こさない）。
      FLOW_BOT_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.CODE_TOKEN }}
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      ISSUE: ${{ inputs.issue }}
      TASKS: ridecompass/ride-compass-tasks
      KIND: ${{ inputs.kind }}
      # 担当は最初の結果で終わる。裏の処理（run_in_background・裏の subagent）は外す。
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/postgis
      # Read が PDF をページで読むときの pdftoppm（apt の一覧は postgis の段が更新してある）。
      - run: sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-batch.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-batch.txt -r requirements-dev.txt
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: git config --global user.name hidakagit && git config --global user.email 6731891+hidakagit@users.noreply.github.com
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CODE_TOKEN }}
          # 担当はゲートの App が起こす。連携は、名前を挙げていないボットが起こした実行を断る。
          allowed_bots: ridecompass-gate
          # 担当の権限（連携がランナーのユーザー設定へ書く。判定役はユーザー設定の autoMode を読む）。
          settings: ${{ github.workspace }}/.github/claude-task/settings.json
          claude_args: --model claude-opus-5-5 --disallowedTools Monitor,ScheduleWakeup,CronCreate,CronDelete,CronList,Workflow
          prompt: |
            あなたは RideCompass の${{ inputs.kind }}担当です。作業ツリー ${{ github.workspace }} で、置き場 ridecompass/ride-compass-tasks の issue #${{ inputs.issue }} を扱います。
            まず CLAUDE.md と .claude/skills/task-work/SKILL.md の全文（「${{ inputs.kind }}担当」の手順を進める）を読み、その手順のとおりに進めてください。
      # 作る担当の GitHub に無い変更は、ランナーと一緒に消えないよう wip の枝へ残す（作業ブランチは書き換えない）。
      - if: always() && inputs.kind == '作る'
        run: |
          [ -z "$(git status --porcelain)" ] || { git add -A && git commit -q -m "tasks#${ISSUE}: 作業途中（作る担当の終わりに残った未コミットの変更）"; }
          git fetch -q origin
          if [ -z "$(git branch -r --contains HEAD)" ]; then git push -q origin "HEAD:refs/heads/wip/tasks-${ISSUE}-$(date -u +%Y%m%dT%H%M%SZ)"; fi
      # 手番の記録（実行のファイル）を非公開の置き場の日（UTC）ごとのリリースへ置き、issue に終わりを書く（.github/claude-task/after.js）。
      # 1つのリリースに付けられるのは1000件まで（公式の文書「About releases」）。並んで作ると後のほうは作れないので、作られたものへ付ける。
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
          # 連携が書き出す実行のファイル。担当が起きる前に落ちたときは無い。
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          TAG="turns-$(date -u +%F)"; NAME="tasks-$ISSUE-$GITHUB_RUN_ID.json.gz"; LOG=""
          if [ -f "$EXECUTION_FILE" ] && gzip -c "$EXECUTION_FILE" > "$RUNNER_TEMP/$NAME"; then
            gh release view "$TAG" -R "$TASKS" > /dev/null 2>&1 || gh release create "$TAG" -R "$TASKS" --title "担当の手番の記録 ${TAG#turns-}" --notes "" || true
            gh release upload "$TAG" "$RUNNER_TEMP/$NAME" -R "$TASKS" && LOG="https://github.com/$TASKS/releases/download/$TAG/$NAME"
          fi
          node .github/claude-task/after.js "$KIND" "$EXECUTION_FILE" "$LOG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/end.md"
          gh issue comment "$ISSUE" -R "$TASKS" --body-file "$RUNNER_TEMP/end.md"
      # 担当が Claude の利用の上限・認証で止まったら、この段が落ちる。ゲートはこの段の名前（flow.config.json: quotaStep）で読み、振り出しを止める。
      - name: 利用の上限で止まった
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: node .github/claude-task/after.js --quota "$EXECUTION_FILE"
