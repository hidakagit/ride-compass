# 担当（作る・確かめる）を1件、GitHub Actions のランナーで動かす。振り出し（claude-dispatch.yml）が起こす。手でも起こせる:
#   gh workflow run claude-task.yml -R hidakagit/ride-compass -f issue=<置き場の issue の番号> -f kind=<作る|確かめる>
# 担当は docs/conventions/flow.md の「作る担当」「確かめる担当」の手順を進める。種類「開発機」は担当を動かさず、開発機の対話の
# セッションがそのタスクを触る間、下のグループを持つだけの実行（tools/flow-gate/bin/hold.js が起こし、取り消して手放す）。
# このリポジトリは公開で、Actions の記録は誰でも読める。担当の出力の全文（show_full_output）と報告（display_report）は出さない。
name: Claude Task
# 振り出しは、この名前から動いている担当の issue の番号を読む（tools/flow-gate/src/dispatch.js: runOf）。
run-name: "#${{ inputs.issue }} ${{ inputs.kind }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 置き場（ridecompass/ride-compass-tasks）の issue の番号
        required: true
      kind:
        description: 担当の種類
        required: true
        type: choice
        options: [作る, 確かめる, 開発機]

permissions:
  contents: read

# 1つのタスクを触るのは1者だけ: 同じ issue の実行（作る・確かめる・開発機）は1本ずつ動き、あとから来たものは取り消されずに
# 順に待つ（queue: max）。待っていた担当は、前の実行が終わってから最初の段で照らされ、行き先が無ければ何もせず終わる。
concurrency:
  group: claude-task-${{ inputs.issue }}
  queue: max

jobs:
  # 開発機の対話のセッションがタスクを触る間、グループを持つ。取り消されるか、ジョブの上限（6時間）で止まると手放す。
  hold:
    if: inputs.kind == '開発機'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - run: sleep 21600

  task:
    if: inputs.kind != '開発機'
    # backend のテストを CI（ci.yml の backend）と同じ aarch64・同じ PostgreSQL + PostGIS で流せるようにする。
    runs-on: ubuntu-24.04-arm
    # 担当の持ち時間。超えると Actions がジョブを止め、最後の段（後始末）が落ちたものとして扱う。
    timeout-minutes: 240
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
      # 置き場へ書く道具（tools/flow-gate/bin/cli.js）は hidakagit-bot、コードのリポジトリの gh は hidakagit の名義。
      # マージを GITHUB_TOKEN で打つと master の CI とデプロイが起きないので、hidakagit のトークンで打つ。
      FLOW_BOT_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.CODE_TOKEN }}
      ISSUE: ${{ inputs.issue }}
      KIND: ${{ inputs.kind }}
      # 担当の実行は最初の結果で終わり、裏の処理の知らせで起こし直されない。Bash の run_in_background と裏の subagent を外す
      # （Monitor・ScheduleWakeup 等は claude_args の --disallowedTools で外す）。
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 作るなら未着手 → 進行中が通ったときだけ、確かめるなら検証中のときだけ進み、issue に着手を書く。
      - name: 引き受ける
        id: claim
        run: |
          if node tools/flow-gate/bin/claim.js "$ISSUE" "$KIND" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
      # ci.yml の backend と同じ PostgreSQL + PostGIS。
      - if: steps.claim.outputs.go == 'true'
        uses: ./.github/actions/postgis
      # Read が PDF をページで読むときに使う pdftoppm。apt の一覧は上の段の apt.postgresql.org.sh が更新してある。
      - name: poppler-utils（PDF のページの読み込み）
        if: steps.claim.outputs.go == 'true'
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-python@v6
        if: steps.claim.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-batch.txt
            backend/requirements-dev.txt
      - if: steps.claim.outputs.go == 'true'
        run: pip install -r requirements-batch.txt -r requirements-dev.txt
        working-directory: backend
      - if: steps.claim.outputs.go == 'true'
        run: npm ci
        working-directory: frontend
      # e2e を手元で回すための Playwright の Chromium（ci.yml の e2e と同じ入れ方）。
      - if: steps.claim.outputs.go == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: git の名義
        if: steps.claim.outputs.go == 'true'
        run: |
          git config --global user.name hidakagit
          git config --global user.email 6731891+hidakagit@users.noreply.github.com
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.claim.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CODE_TOKEN }}
          # 権限の決まり（自動モード・拒否の一覧・判定役への説明。master の版）。連携は settings をユーザー設定へ混ぜて書き、判定役は
          # ユーザー設定の autoMode を読む（リポジトリの .claude/settings.json の autoMode は読まない）。
          settings: ${{ github.workspace }}/tools/flow-gate/settings.json
          claude_args: --model claude-opus-5-5 --disallowedTools Monitor,ScheduleWakeup,CronCreate,CronDelete,CronList,Workflow
          # 決まりも環境の説明も写さず、読む節だけを指す（docs/conventions/flow.md「担当」の3）。
          prompt: |
            あなたは RideCompass の${{ inputs.kind }}担当です。作業ツリー ${{ github.workspace }} で、置き場 ridecompass/ride-compass-tasks の issue #${{ inputs.issue }} を扱います。
            まず CLAUDE.md と docs/conventions/flow.md の「担当」「${{ inputs.kind }}担当」「問い」「issue の形」を読み、その手順のとおりに進めてください。
      # 作る担当の GitHub に無い変更は、マシンと一緒に消えないよう wip の枝へ残す（作業ブランチは書き換えない）。
      - name: 残った変更
        if: always() && steps.claim.outputs.go == 'true' && inputs.kind == '作る'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -q -m "tasks#${ISSUE}: 作業途中（作る担当の終わりに残った未コミットの変更）"
          fi
          git fetch -q origin
          if [ -z "$(git branch -r --contains HEAD)" ]; then
            wip="wip/tasks-${ISSUE}-$(date -u +%Y%m%dT%H%M%SZ)"
            git push -q origin "HEAD:refs/heads/${wip}"
            echo "GitHub に無い変更を ${wip} へ残した"
          fi
      # 担当の外の失敗（利用の上限・認証・サーバー）ならタスクを未着手へ戻し、上限・認証なら振り出しをしばらく止める。
      # それ以外で作る担当のタスクが進行中のままなら、落ちたとして保留にする（tools/flow-gate/bin/after.js）。
      # 最後に issue へ終わり（担当の最後の発言を含む）を書く。発言は非公開の置き場にだけ書き、この記録には出さない。
      - name: 後始末
        if: always() && steps.claim.outputs.go == 'true'
        run: node tools/flow-gate/bin/after.js "$ISSUE" "$KIND" "${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "${{ job.status }}"
