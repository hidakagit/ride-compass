# 変異テストの全部の測りと、テストの見直し。backend の app の関数の中を機械的に1か所ずつ書き換え（mutmut 3.8.0 が作る変異）、
# 変異ごとに、その関数を通るテストを最後まで回して、どのテストが落ちたかを記録し、.claude/rules/testing.md「テストを変異テストで
# 見直す」の候補を出す（tasks#661）。回し方と結果の読み方は .claude/skills/test-review/SKILL.md。
#
# - 手で起こす（gh workflow run mutation.yml、または Actions → Mutation → Run workflow）。測る版と台本は、起こすときに
#   選んだ ref から読む（台本は backend/scripts/mutation/。台本を直すたびにこのファイルを変えずに済む）。
# - 3段で回る:
#   1. shard（8本）: 変異と、テストの当たる関数ごとの基準（変異を入れずに同じテストを2回）を1つの無作為の並び（種を固定）に
#      して、行を順に配り、1本ずつ別のランナーで回す。1本の中ではテストDBを分けた4つの担い手で回す（CI の backend と同じ
#      arm64・4コアのランナー）。
#   2. recheck（8本）: 1 の結果を集計し、生き残りのうち読み込みのときに呼ばれうる関数の変異（importtime.py）に、テスト全体を
#      当て直す。
#   3. review（1本）: 1・2 を集計し（analyze.py）、見直しの候補を出す（review.py）。前の実行の見直し（成果物 mutation-review）を
#      取ってきて比べ、2回続けて重なりの候補になったテストを消す一覧にする。表は実行の要約に出す。
# - 測る版の backend/scripts/mutation/ に一覧（only.txt・recheck.txt・baseline.txt）があれば、1 はその一覧だけを回し、2・3 は
#   走らない（消したあとの確かめ等。run-checks/SKILL.md「変異テストでテストの効きを測る」）。
# - 持ち時間: 2026-10-09 の同じ形の測りで、1 は1本あたり55〜59分（基準は別に回して9分）、2 は26分だった。担い手は始めて
#   stop_after 分で新しい変異を取らずに抜け、持ち時間の前に結果を残す。
# - 成果物: 1・2 は mutation-<番号>・recheck-<番号>（14日）、3 は mutation-review（次の見直しが比べるので90日）。
name: Mutation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 測る版（台本も同じ版の backend/scripts/mutation/ から読む）
        required: true
        default: master
      count:
        description: 1本あたりに回す変異の数（0 で配られた分を全部。試しに少なく回すときに使う）
        required: true
        default: "0"
      stop_after:
        description: 1本の担い手が新しい変異を取るのをやめるまでの分
        required: true
        default: "150"

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

env:
  SHARDS: 8
  WORKERS: 4
  MUT_OUT: /tmp/mutation
  MUT_DB_PREFIX: mut_w
  TEST_DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test
  DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@localhost:5432/ridecompass_test

jobs:
  shard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: backend
    outputs:
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: mode
        name: 全部の測りか、一覧だけか
        run: |
          if ls scripts/mutation/only.txt scripts/mutation/recheck.txt scripts/mutation/baseline.txt 2>/dev/null; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/postgis
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-batch.txt
            backend/requirements-dev.txt
      # mutmut は測るときだけ入れる（開発の依存には足さない）。
      - run: pip install -r requirements-batch.txt -r requirements-dev.txt mutmut==3.8.0
      - name: 担い手ごとのテストDB
        run: |
          for i in $(seq 0 $((WORKERS - 1))); do
            sudo -u postgres createdb -O ridecompass -T ridecompass_test "${MUT_DB_PREFIX}$i"
          done
      - name: 変異を作り、関数ごとに通るテストを記録する
        run: |
          mkdir -p "$MUT_OUT"
          cp scripts/mutation/setup.cfg setup.cfg
          python scripts/mutation/gen.py
      - name: 変異と基準を分ける
        working-directory: backend/mutants
        env:
          SHARD: ${{ matrix.shard }}
          COUNT: ${{ inputs.count }}
          MUT_WITH_BASELINE: "1"
        run: |
          python ../scripts/mutation/plan.py
          awk -v s="$SHARD" -v n="$SHARDS" '(NR - 1) % n == s' "$MUT_OUT/all.txt" > "$MUT_OUT/shard.txt"
          if [ "$COUNT" -gt 0 ]; then head -n "$COUNT" "$MUT_OUT/shard.txt" > "$MUT_OUT/shard.tmp" && mv "$MUT_OUT/shard.tmp" "$MUT_OUT/shard.txt"; fi
          echo "この本で回す変異と基準: $(wc -l < "$MUT_OUT/shard.txt") 件"
      - name: 回す
        working-directory: backend/mutants
        env:
          STOP_AFTER_MINUTES: ${{ inputs.stop_after }}
        run: |
          MUT_STOP_AFTER=$((STOP_AFTER_MINUTES * 60)) python ../scripts/mutation/runner.py "$MUT_OUT/shard.txt" "$MUT_OUT/results.jsonl" "$WORKERS"
          cp mutmut-stats.json "$MUT_OUT/"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.shard }}
          path: |
            /tmp/mutation/results.jsonl
            /tmp/mutation/shard.txt
            /tmp/mutation/rows.json
            /tmp/mutation/mutmut-stats.json
            /tmp/mutation/kills/
          retention-days: 14
          if-no-files-found: warn

  recheck:
    needs: shard
    if: needs.shard.outputs.full == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/postgis
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-batch.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-batch.txt -r requirements-dev.txt mutmut==3.8.0
      - name: 担い手ごとのテストDB
        run: |
          for i in $(seq 0 $((WORKERS - 1))); do
            sudo -u postgres createdb -O ridecompass -T ridecompass_test "${MUT_DB_PREFIX}$i"
          done
      - name: 変異を作り、関数ごとに通るテストを記録する
        run: |
          mkdir -p "$MUT_OUT"
          cp scripts/mutation/setup.cfg setup.cfg
          python scripts/mutation/gen.py
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-?
          path: /tmp/art
      - name: 当て直す変異を拾って分ける
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python scripts/mutation/analyze.py /tmp/art > "$MUT_OUT/analyze.txt"
          python scripts/mutation/importtime.py /tmp/art/survivors.json scripts/mutation/recheck.txt
          awk -v s="$SHARD" -v n="$SHARDS" 'NF && (NR - 1) % n == s' scripts/mutation/recheck.txt > "$MUT_OUT/shard.txt"
          echo "この本で当て直す変異: $(wc -l < "$MUT_OUT/shard.txt") 件"
      - name: テスト全体を当て直す
        working-directory: backend/mutants
        run: python ../scripts/mutation/runner.py "$MUT_OUT/shard.txt" "$MUT_OUT/results.jsonl" "$WORKERS"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recheck-${{ matrix.shard }}
          path: |
            /tmp/mutation/results.jsonl
            /tmp/mutation/shard.txt
            /tmp/mutation/kills/
          retention-days: 14
          if-no-files-found: warn

  review:
    needs: [shard, recheck]
    if: needs.shard.outputs.full == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-?
          path: /tmp/art
      - uses: actions/download-artifact@v4
        with:
          pattern: recheck-?
          path: /tmp/rart
      - name: 前の実行の見直しを取る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/prev
          prev=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=mutation-review&per_page=30" \
            -q '[.artifacts[] | select(.expired | not) | select(.workflow_run.id != ${{ github.run_id }})][0].workflow_run.id // empty')
          if [ -n "$prev" ]; then
            gh run download "$prev" -R "${{ github.repository }}" -n mutation-review -D /tmp/prev
            echo "前の見直し: 実行 $prev"
          else
            echo "前の見直しは無い（消す一覧は空になる）"
          fi
      - id: review
        name: 集計して見直す
        run: |
          mkdir -p /tmp/review
          python scripts/mutation/analyze.py /tmp/art /tmp/rart | tee /tmp/review/analyze.txt
          python scripts/mutation/review.py /tmp/art /tmp/prev /tmp/review
          cat /tmp/review/summary.md >> "$GITHUB_STEP_SUMMARY"
          cp /tmp/art/summary.json /tmp/art/pertest.json /tmp/art/survivors.json /tmp/review/
      # 変異を全部回し終えた測りの見直しだけを残す（途中で止まった測り・count で減らした試しを、次の見直しが前回として
      # 読まないように）。見直しが落ちたときも残さない。
      - if: steps.review.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-review
          path: /tmp/review/
          retention-days: 90
          if-no-files-found: warn
