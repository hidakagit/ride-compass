# 文書と台帳の整合（scripts/review_checks.py docs）。
#
# ci.ymlはdocs/**・*.mdだけの変更では走らないが、この検査はその変更こそが対象なので、
# 別ワークフローにして常に走らせる。**常に全件**を見る——検知器はどの走査範囲でも
# 同じ答えになる事実だけを扱うので、差分の起点を解決する必要がない（設計要件は
# scripts/review_checks.py の冒頭）。pure pythonで数秒。
name: Docs Consistency

on:
  push:
    # orch/** は並行実行の作業ブランチ（ci.ymlと同じ）。
    branches: [master, "orch/**"]
  pull_request:
  workflow_dispatch:

jobs:
  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/review_checks.py docs
