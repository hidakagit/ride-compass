# 文書と台帳の整合（scripts/review_checks.py docs）。
#
# メインのci.ymlはdocs/**・**/*.mdの変更を無償枠の消費対策でスキップするため、この検査
# だけは別ワークフローにして常に走らせる。**常に全件**を見る——検知器はどの走査範囲でも
# 同じ答えになる事実だけを扱うので、差分の起点を解決する必要がない（設計要件は
# scripts/review_checks.py の冒頭）。pure pythonで数秒。
name: Docs Consistency

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/review_checks.py docs
