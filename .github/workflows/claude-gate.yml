# タスクの流れのゲート（tools/flow-gate/）の検査と公開。製品の CI（ci.yml）と分けて持ち、タスク管理だけの変更で
# 製品の重い検査とデプロイを走らせない（置き場の定義は .github/taskflow-paths）。
#
# - flow-gate: lint とテスト。コードのリポジトリの必須チェックに置く。数十秒で終わるので変更されたパスで飛ばさず、
#   どの変更でも走らせる（ワークフローを paths で飛ばすと必須チェックが Pending のまま残る。docs/architecture/tech-stack.md「CIの実行枠」）。
# - deploy-gate: master への push で flow-gate が通ったら、ゲートと回答フォームを Cloudflare へ公開する。
name: Claude Gate

on:
  push:
    # 作業ブランチ（orch/**）へのpushでは走らせない（ci.ymlと同じ）。
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # lint が構文と import の解決（無いファイル・無い名前）を動かさずに見る。
  # テストは部品（src/）しか読み込まないので、道具（bin/）の静的な誤りは lint だけが落とす。
  flow-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/flow-gate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/flow-gate/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
  # 公開は Cloudflare の公式の wrangler-action で行い、直後に開いた issue を全部、今の規則が書くはずの姿（担当者・本文の先頭）へ
  # 揃える（揃っていれば何も書かない）。tools/flow-gate/ の差分の有無で選ばず、master の先頭の実行が毎回公開する。差分で
  # 選ぶと、ゲートを変えた push の公開が落ちたとき、ゲートを触らない次の push が公開せず、公開済みの版が古いまま残る。
  # 実行どうしは1本ずつ動かし、master の先頭でなくなった実行は公開しない（遅れて終わった古い実行が新しい版を上書きしない。
  # 新しい版は、その push の実行が公開する）。
  deploy-gate:
    needs: [flow-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - id: head
        run: |
          if [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=deploy-gate::master の先頭ではないので公開しない（先頭の実行が公開する）"
          fi
      - if: steps.head.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/flow-gate
          command: deploy
      - if: steps.head.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/flow-gate
          command: deploy --env form
      - if: steps.head.outputs.latest == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: steps.head.outputs.latest == 'true'
        env:
          FLOW_BOT_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
        run: node tools/flow-gate/bin/refresh.js
