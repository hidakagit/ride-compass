# タスクの流れのゲート（tools/flow-gate/）の検査と公開。製品の CI（ci.yml）と分ける理由は docs/architecture/tech-stack.md「CIの実行枠」。
# flow-gate（必須の検査）: lint とテストと、Pull Request の本文の形（本文は master のコミットになるので、直したときも照らす）。
# deploy-gate: master への push で、ゲートと回答フォームを Cloudflare へ公開する。差分で選ばず、master の先頭の実行が毎回公開する
# （ゲートを変えた push の公開が落ちても、次の push が公開し直す）。先頭でなくなった実行は、新しい版を上書きしないよう公開しない。
name: Claude Gate

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  flow-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/flow-gate/package-lock.json
      - run: npm ci && npm run lint && npm test
        working-directory: tools/flow-gate
      # Dependabot の PR はマージしない（同じ版を取り込んだタスクが閉じる）ので照らさない。本文は環境変数で渡す（シェルに読ませない）。
      - if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md" && node scripts/pr-body.js "$RUNNER_TEMP/pr-body.md"
  deploy-gate:
    needs: [flow-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gate
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      matrix:
        command: [deploy, deploy --env form]
    steps:
      - uses: actions/checkout@v5
      - id: head
        run: '[ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA" ] && echo "latest=true" >> "$GITHUB_OUTPUT" || echo "master の先頭ではないので公開しない"'
      - if: steps.head.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/flow-gate
          command: ${{ matrix.command }}
