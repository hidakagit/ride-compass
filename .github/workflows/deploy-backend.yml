# backendをOracle Cloud VM（DBと同居）へデプロイする（改善計画T261/T263）。
# Renderの無料プラン（0.1 CPU/512MB）が冷パスの重いリクエストでクラッシュ→自動復旧を
# 繰り返す障害（T261）を受け、DBが既に稼働しているOracle Cloud Always Free VM
# （2 OCPU/12GB・egress月10TB）へbackendを同居させることにした。
#
# 当初はGitHub Actions（amd64ランナー）でビルドしghcr.ioへpushする方式（VM側の負荷を
# 避ける狙い）を試みたが、VMがAmpere A1（arm64）のためQEMUエミュレーションでの
# クロスビルドが必要になり、実測で10分超かかっても終わらないほど非現実的に遅かった
# （numpy/scipy等C拡張を含む依存関係のインストール自体がエミュレーション対象になるため）。
# VM上でのネイティブビルドは実測約3分で完了することを確認済みのため、SSH経由で
# VM自身にgit pull→dockerビルド→再起動させる方式へ変更した（レジストリ不要）。
name: Deploy Backend to Oracle VM

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (native arm64 build on VM)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/ridecompass-repo
            git fetch --depth 1 origin master
            git reset --hard origin/master
            cd backend
            # GIT_COMMIT: Renderは`RENDER_GIT_COMMIT`をデプロイ先へ自動注入していたが、
            # このVM上でのDocker運用にはその仕組みが無い。「本番に実際にどのコミットが
            # 反映されているか」を/healthから確認できるようにするため、実際にビルドした
            # HEADのSHAを明示的にコンテナへ渡す（改善計画T263フォローアップ、config.py:
            # settings.git_commit参照）。
            GIT_COMMIT=$(git rev-parse HEAD)
            # CORS_ALLOWED_ORIGINSの自己修復（改善計画T315）: この値はgit管理外の
            # VM上の環境変数ファイルで手動管理されており、本番フロントのオリジンと
            # 食い違うと「ブラウザから直接叩くAPI（例: POST /api/routes/generate）だけが
            # TypeError: Failed to fetchで即時失敗するが、サーバー間通信を使う画面
            # [軸スタジオ等]は正常」という診断しづらい障害になる(2026-08-18・
            # 2026-08-25の2回実際に発生)。デプロイのたびに本番フロントの既知オリジンが
            # 含まれているか確認し、無ければ追記する（既存の値・他のオリジンは変更しない、
            # 何度実行しても安全な冪等処理）。
            ENV_FILE=/home/ubuntu/ridecompass-backend.env
            REQUIRED_ORIGIN="https://ride-compass-frontend.onrender.com"
            if ! grep -q "^CORS_ALLOWED_ORIGINS=" "$ENV_FILE"; then
              echo "CORS_ALLOWED_ORIGINS=$REQUIRED_ORIGIN" | sudo tee -a "$ENV_FILE" > /dev/null
            elif ! grep "^CORS_ALLOWED_ORIGINS=" "$ENV_FILE" | grep -qF "$REQUIRED_ORIGIN"; then
              sudo sed -i "s#^CORS_ALLOWED_ORIGINS=.*#&,$REQUIRED_ORIGIN#" "$ENV_FILE"
            fi
            sudo docker build -t ridecompass-backend:latest .
            # 改善計画T538: backend/data配下（DEMタイルキャッシュ・タイル材料/スコア行列の
            # ディスク永続化キャッシュ）はコンテナの書き込み可能レイヤーに置かれており、
            # ボリュームマウントが無いとdocker rm時に消えてしまう（デプロイのたびに
            # T538の永続化が無意味化する）。ホスト側ディレクトリへマウントして永続化する。
            sudo mkdir -p /home/ubuntu/ridecompass-cache-data
            # migration適用（改善計画T349）: axis_definitionsのDB読み込みがfail-fast化された
            # ため（services/axis_registry_service.py参照）、migration未適用のまま新コンテナを
            # 起動すると即座に起動失敗してサービス全体が止まる。旧コンテナをstopする前
            # （＝サービスが動いたまま）のこのタイミングでmigrationを適用し、失敗時は
            # set -eでデプロイ全体を中断させる（旧コンテナは無傷のまま残り、down timeにならない）。
            # ビルド済みイメージをそのまま使い、実際に起動する本番コンテナと同じ依存関係・
            # 同じmigrationsディレクトリで実行する。
            sudo docker run --rm \
              --network=host \
              --env-file /home/ubuntu/ridecompass-backend.env \
              ridecompass-backend:latest \
              python scripts/apply_migrations.py
            # -t 90: docker stopの既定SIGTERM猶予(10秒)は、ルート生成(通常は数秒〜十数秒、
            # 冷パスは最大316秒実測)の完了を待つには短すぎ、デプロイと処理中リクエストが
            # 重なると接続がRSTで強制切断され、フロントで「TypeError: Failed to fetch」
            # として観測される障害があった(改善計画T314)。uvicorn(--workers未指定の単一
            # プロセス、backend/Dockerfile)はSIGTERM受信で新規接続を止め既存接続の完了を
            # 待つグレースフルシャットダウンが既定動作のため、猶予さえ延ばせばアプリ側の
            # 変更なしで解決する。90秒は本番実測の大半のケース(4〜17秒)を十分にカバーする
            # 値として選んだ(冷パス最悪ケース316秒まで待つと通常デプロイが長時間ブロック
            # されるため、そこまでは保証しない意図的なトレードオフ)。
            # 真のゼロダウンタイム(新コンテナを起動しヘルスチェック後に旧を止める
            # blue/green)は、--network=hostで単一ポートを共有する現在の構成では
            # 新旧コンテナを同時起動できず実現できない(VM上nginx側のポート切替が別途
            # 必要、リポジトリ管理外のため本タスクのスコープ外)。
            sudo docker stop -t 90 ridecompass-backend 2>/dev/null || true
            sudo docker rm ridecompass-backend 2>/dev/null || true
            # --network=host: PostgreSQLがこのVMにネイティブ（Dockerコンテナ外）で
            # 稼働しているため、コンテナ内からDATABASE_URL=localhost:5432で到達させるには
            # ブリッジネットワーク（既定）ではなくホストのネットワーク名前空間を共有する
            # 必要がある（ブリッジのままだとコンテナ内のlocalhostはコンテナ自身を指し、
            # ConnectionRefusedErrorになる。実機で確認済み）。
            # --log-opt: 既定のjson-fileドライバはログサイズに上限が無く、無制限に
            # ディスクを消費しうる（Renderでは基盤側が保持期間を管理してくれていたが、
            # 自前運用ではこちらで明示する必要がある）。10MB×5世代=最大50MBに制限する。
            sudo docker run -d \
              --name ridecompass-backend \
              --restart unless-stopped \
              --memory=6g --memory-swap=6g \
              --network=host \
              --log-opt max-size=10m --log-opt max-file=5 \
              -v /home/ubuntu/ridecompass-cache-data:/app/data \
              --env-file /home/ubuntu/ridecompass-backend.env \
              -e GIT_COMMIT="$GIT_COMMIT" \
              ridecompass-backend:latest
            sudo docker image prune -f
