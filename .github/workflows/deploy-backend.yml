# backendをOracle Cloud VM（DBと同居）へデプロイする（改善計画T261/T263）。
# Renderの無料プラン（0.1 CPU/512MB）が冷パスの重いリクエストでクラッシュ→自動復旧を
# 繰り返す障害（T261）を受け、DBが既に稼働しているOracle Cloud Always Free VM
# （2 OCPU/12GB・egress月10TB）へbackendを同居させることにした。
#
# 当初はGitHub Actions（amd64ランナー）でビルドしghcr.ioへpushする方式（VM側の負荷を
# 避ける狙い）を試みたが、VMがAmpere A1（arm64）のためQEMUエミュレーションでの
# クロスビルドが必要になり、実測で10分超かかっても終わらないほど非現実的に遅かった
# （numpy/scipy等C拡張を含む依存関係のインストール自体がエミュレーション対象になるため）。
# VM上でのネイティブビルドは実測約3分で完了することを確認済みのため、SSH経由で
# VM自身にgit pull→dockerビルド→再起動させる方式へ変更した（レジストリ不要）。
name: Deploy Backend to Oracle VM

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (native arm64 build on VM)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/ridecompass-repo
            git fetch --depth 1 origin master
            git reset --hard origin/master
            cd backend
            sudo docker build -t ridecompass-backend:latest .
            sudo docker stop ridecompass-backend 2>/dev/null || true
            sudo docker rm ridecompass-backend 2>/dev/null || true
            # --network=host: PostgreSQLがこのVMにネイティブ（Dockerコンテナ外）で
            # 稼働しているため、コンテナ内からDATABASE_URL=localhost:5432で到達させるには
            # ブリッジネットワーク（既定）ではなくホストのネットワーク名前空間を共有する
            # 必要がある（ブリッジのままだとコンテナ内のlocalhostはコンテナ自身を指し、
            # ConnectionRefusedErrorになる。実機で確認済み）。
            sudo docker run -d \
              --name ridecompass-backend \
              --restart unless-stopped \
              --memory=6g --memory-swap=6g \
              --network=host \
              --env-file /home/ubuntu/ridecompass-backend.env \
              ridecompass-backend:latest
            sudo docker image prune -f
