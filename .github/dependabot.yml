# 依存関係の既知脆弱性・更新をDependabotへ検知させる。
# 自動マージはしない。取り込み方は docs/architecture/tech-stack.md「DependabotのPull Requestは、同じ版を取り込んだタスクが閉じる」。
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest と @vitest/* は peer で同じ版を求め合い、片方だけ上げると npm ci が止まる
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
