services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Next.jsサーバー（コンテナ内）からバックエンドに到達するためのURL。
      # ブラウザから見えるNEXT_PUBLIC_API_URL（localhost:8000）とは異なり、
      # コンテナ間はサービス名で到達する必要がある（/api/basemapのプロキシ用）。
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      # ROAD_GRAPH_USE_REPOSITORY/DEBUG_MODE等、下のenvironment:で上書きしない設定値は
      # ここから読み込む（無ければ空のまま起動、config.pyのデフォルト値を使う）。
      # required: false が無いと、.envの無いチェックアウトではbackend以外のサービスへの
      # `docker compose exec`まで「env file not found」で止まる。
      - path: .env
        required: false
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # SQLAlchemyの非同期エンジン（asyncpgドライバ）用のURLスキーム。
      DATABASE_URL: postgresql+asyncpg://ridecompass:ridecompass@postgres:5432/ridecompass
      BASEMAP_PUBLIC_BASE_URL: http://localhost:3000/api/basemap
      # JMA気象データの短命キャッシュ。
      # サービス名"redis"はDockerネットワーク内のみで解決するため、config.pyの既定値
      # （localhost、本番--network=host用）をここで上書きする。
      REDIS_URL: redis://redis:6379/0
    volumes:
      # 標高/路面/地図タイルの永続キャッシュ（SQLite＋ファイルキャッシュ）をコンテナ再作成後も保持する
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    # JMA気象データの短命キャッシュ。全用途がTTL付きで、失っても外部から取り直せる
    # ため、永続化ボリュームは設けない
    # （コンテナ再作成でキャッシュが消えても次回アクセスで自己修復する）。
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    # 版は本番に合わせる（正本はdocs/architecture/tech-stack.md「DBの版」）。
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ridecompass
      POSTGRES_PASSWORD: ridecompass
      POSTGRES_DB: ridecompass
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18以降のイメージはデータを/var/lib/postgresql配下の版ごとの
      # ディレクトリへ置く。データ形式はメジャー版の間で互換が無く、旧版のボリュームは
      # 新しい版で開けないため、ボリューム名に版を入れる。
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      # TCPで確かめる。初期化中の一時サーバーはUnixソケットだけで待ち受けるため、
      # ソケットで確かめると拡張の作成が終わる前にhealthyになる。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ridecompass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres18-data:
