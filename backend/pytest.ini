[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# 宣言していないマーカーは綴りの誤りとして収集時に止める（誤ったマーカーは黙って何も選ばない）。
addopts = --strict-markers
# xfailの印が付いたテストが通ったら失敗にする（直ったのに印が残ると、次に壊れても気づけない）。
xfail_strict = true
# 止まったテストを落とす上限（秒、1件のfixtureの準備・本体・後片付けの合計）。pytest-timeoutが読む。
# ふだんの1件の最長（--durationsで測る）はCIで6.5秒・開発機で24秒で、開発機の最長の5倍に置く。Windowsではスレッド方式になり、時間切れでプロセスごと終わる（後片付けは走らない）。
timeout = 120
markers =
    postgis: ローカルDBが必要なPostGIS統合テスト（接続先はtests/conftest.py: postgis_database_url）。`-m "not postgis"`で除外可能

# rasterio（way_landcoverの集計で使う）が内部でAffine行列を`*`で掛けており、affineが
# PendingDeprecationWarningを出す。こちらのコードからの呼び出しではなくライブラリ内部の
# 実装のため、rasterio側の対応を待つ以外に手が無い。メッセージを限定して黙らせ、
# 他のPendingDeprecationWarningは引き続き見えるようにする。
# starlette 0.41.3のTestClientが`anyio.abc.BlockingPortal`（非推奨エイリアス）を型注釈で
# 参照しており、anyio 4.14以降がDeprecationWarningを出す。こちらのコードからの参照では
# なくライブラリ内部のため、starlette側（fastapiの依存範囲に縛られる）の更新を待つ以外に
# 手が無い。メッセージを限定して黙らせ、他のDeprecationWarningは引き続き見えるようにする。
# starletteのTestClientが内部で使うanyioのストリーム（Send/Receiveの対）が、ガベージコレクション時に
# ResourceWarningを出す。閉じるのはライブラリ側の責務で、こちらからは触れない。加えて
# **どのテストに付くかはGCのタイミング次第**（単独実行では出ない）ため、errorにすると
# 毎回違うテストが落ちる。メッセージを限定して黙らせる。
# 既定はerror。**警告は見えないと誰も直さない**ため、無視するものは下へ理由付きで
# 1行ずつ並べる。依存を上げたときにその行が不要になったら消す。
filterwarnings =
    error
    ignore:Use `@` matmul instead of .* mul operator for matrix multiplication:PendingDeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:.*Unclosed <MemoryObject.*
