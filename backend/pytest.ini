[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    postgis: ローカルDB（ridecompass_test）が必要なPostGIS統合テスト。`-m "not postgis"`で除外可能

# rasterio（way_landcoverの集計で使う）が内部でAffine行列を`*`で掛けており、affineが
# PendingDeprecationWarningを出す。こちらのコードからの呼び出しではなくライブラリ内部の
# 実装のため、rasterio側の対応を待つ以外に手が無い。メッセージを限定して黙らせ、
# 他のPendingDeprecationWarningは引き続き見えるようにする。
filterwarnings =
    ignore:Use `@` matmul instead of .* mul operator for matrix multiplication:PendingDeprecationWarning
