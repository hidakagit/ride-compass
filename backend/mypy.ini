# ASCII only: mypy reads this file with the locale encoding (cp932 on Japanese Windows).
# Why each setting is here: docs/conventions/testing.md, the section on mypy.
[mypy]
python_version = 3.12
platform = linux
files = app, scripts, benchmarks
mypy_path = scripts
plugins = pydantic.mypy
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

[mypy-apscheduler.*,diskcache.*,mapbox_vector_tile.*]
ignore_missing_imports = True
