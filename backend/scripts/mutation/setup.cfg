# mutmut 3.8.0 の設定。.github/workflows/mutation.yml が backend/setup.cfg へ写して使う（mutmut は打った場所の setup.cfg を読む）。
# 変異を作るのは app の関数の中だけ。回すテストからは、app を確かめないもの（構造の検査・リポジトリの道具を読むテスト）を外す。
# app/domain/routing.py は numba の JIT が差し込みを翻訳できず、差し込んだ写しでテストが落ちるので外す。
# ログと警告の行には変異を作らない（do_not_mutate_patterns。mutmut は1行ずつ正規表現を当て、合った行で始まる式を書き換えない）。
# そこを書き換えて気づくテストは書かないので、生き残りに数えると守りの穴の一覧を埋もれさせる（tasks#728）。計測の時計
# （monotonic 等）は回数制限のような振る舞いにも使うので外さない。
[mutmut]
source_paths=app
pytest_add_cli_args_test_selection=tests
    --ignore=tests/structure
    --ignore=tests/test_deploy_backend_gate.py
    --ignore=tests/test_prod_route_check.py
    --ignore=tests/test_run_probe.py
pytest_add_cli_args=-p
    no:cacheprovider
    -p
    no:randomly
    --maxfail=1000000
also_copy=pytest.ini
    scripts
    benchmarks
    ops
do_not_mutate=app/domain/routing.py
do_not_mutate_patterns=\blogger\.
    \blogging\.
    \bwarnings\.warn\(
