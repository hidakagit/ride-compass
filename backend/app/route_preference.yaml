# Evaluation Engine（domain/evaluation.py）がEdge Costを算出する際の既定の重み。
# scoring.yaml（ルート単位・candidate集合内の相対評価、RouteScorer用）とは対象が異なる
# 別設定（Edge単位・単体のEdgeに対する絶対評価、EvaluationService用）のため分離している。
#
# キーはaxis_id（backend/app/domain/axis_definitions.py: AXIS_DEFINITIONSと厳密一致、
# 改善計画T221 Stage Bで旧`elevation_weight`等のフィールド名キーからaxis_idキーへ移行。
# 対応: elevation_weight→gradient / road_weight→surface_q / wind_weight→wind /
# stop_weight→stop_density / car_stress_weight→car_stress / accident_weight→accident /
# night_weight→night）。各軸のdefault_weight（AXIS_DEFINITIONS）と同値を既定として
# 明示する（このファイルは運用時の上書き点。値の比率の根拠・軸再編の経緯
# （T138自転車インフラ統合・T139安全度廃止/night分離・T149交差点密度統合等）は
# git履歴の旧コメントとdocs/architecture.md 7章参照）。
# scoring.yamlには停止密度以降の軸を追加しない（ユーザー承認済みのスコープ判断。
# おすすめ度の並び順には効かせない、静的道路属性P1参照）。
# nightは既定0.0で運用する（設計プロンプトの指示どおり。街灯・トンネルを気にする
# ユーザーが研究モードで個別に上げる想定）。
route_preference:
  gradient: 0.15
  surface_q: 0.19
  wind: 0.26
  stop_density: 0.20
  car_stress: 0.20
  accident: 0.08
  night: 0.0
