# 安全度（domain/safety.py: safety_breakdown）の判定レシピの既定値。
# route_preference.yaml（軸間の重み）とは別階層の設定で、こちらは「安全度軸」固有の
# 中身（街灯・トンネルの各補正）を定義する。highway別基準値・cycleway/maxspeed/
# lanes[多い方]/指定路線の各補正は、交通ストレス・安全度が共有する「車との近さ」(N2)の
# 材料として road_suitability_recipe.yaml / motor_vehicle_density_recipe.yaml へ
# 切り出し済み（改善計画: 車との近さ材料の共有元化。交通ストレスとは別概念[快適性では
# なく客観的な事故・怪我リスク]のため、街灯・トンネルという安全度固有の補正だけが
# ここに残る）。ここを変えると地図の色分け（frontend/src/components/Map/
# safetyExpression.tsが同じレシピをMapLibre expressionとして再現）とルート採点の
# 両方に影響する。値はdomain/safety.py: SafetyRecipeの既定値と完全に一致させてある。
#
# shoulder_adjustment（路肩、-1）は改善計画T102の実測（関東本土1,329,632way中0件、
# 付与率0.0%）で「死に補正」と判明し、T122で撤去した。地域拡大等でshoulderタグの
# 付与が増えたら、この実測値を根拠に復活を再検討する。
safety_recipe:
  lit_adjustment: -1
  tunnel_adjustment: 1
