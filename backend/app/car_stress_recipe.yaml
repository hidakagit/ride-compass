# 交通ストレス（domain/traffic.py: traffic_stress_breakdown）の判定レシピの既定値。
# route_preference.yaml（軸間の重み）とは別階層の設定で、こちらは「交通ストレス軸」固有の
# 中身（対面通行の少車線道路への緩和、lanes_low）を定義する。highway別基準値・cycleway/
# maxspeed/lanes[多い方]/指定路線の各補正は、交通ストレス・安全度が共有する「車との近さ」(N2)
# の材料として road_suitability_recipe.yaml / motor_vehicle_density_recipe.yaml へ
# 切り出し済み（改善計画: 車との近さ材料の共有元化）。ここを変えると地図の色分け
# （frontend/src/components/Map/trafficStressExpression.tsが同じレシピをMapLibre
# expressionとして再現）とルート採点の両方に影響する。値はdomain/traffic.py:
# TrafficStressRecipeの既定値と完全に一致させてある。
traffic_stress_recipe:
  lanes_low_threshold: 1
  lanes_low_adjustment: -1
