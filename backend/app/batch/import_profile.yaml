# PBF取込プロファイル（docs/osm-pbf-import.md 5.2節）。
# 取込対象の要素を宣言する。matchは「タグ名: 許容値」のANDマッチで、
# "*" はタグの存在のみを要求する（値は任意）。値のリスト指定も可。
version: 1
elements:
  - name: roads
    element_type: way
    match:
      # 取込スコープ＝「地図表示とルート探索の少なくとも一方で使う種別」。
      # 歩行者専用（footway/pedestrian/steps/path）・施設内経路（service）・自動車専用
      # （motorway系）は両方の用途で不要のため除外する。都心実データではhighway=*全件の
      # 73%がfootway/service/steps/path/pedestrian等で占められており、除外することで
      # 生データ量を概算1/3に圧縮できる（関東圏への拡大に向けた容量対策）。
      #
      # 注意: trunk/trunk_linkは**地図表示（幹線道路の把握）のために取り込む**が、
      # ルート探索ではHard Constraint（domain/evaluation.py: DISALLOWED_HIGHWAY_TYPES）
      # により自転車通行不可として除外される。「取込スコープ／ルーティング可否／表示
      # グルーピング」の3つは目的が異なる別定義であり、3者の関係はdocs/architecture.mdの
      # 「道路種別（highway）の3つのスコープ」を参照。ここを変更したら同表も更新すること。
      highway:
        - trunk
        - trunk_link
        - primary
        - primary_link
        - secondary
        - secondary_link
        - tertiary
        - tertiary_link
        - unclassified
        - residential
        - living_street
        - cycleway
        - track
    target: osm_raw_ways
  # 改善計画T99（docs/static-road-attributes-plan.md §2.1「歩行者共用」）: 自転車歩行者共用道
  # （河川敷サイクリングロード等に多い、highway=footway/pathかつ自転車通行可）。上のroadsルールが
  # footway/pathを一律除外しているため（71%が該当し容量対策で除外、上記コメント参照）、
  # 自転車が実際に走る区間だけを別ルールでAND条件（highway AND bicycle）で拾う。マッチした
  # wayはdomain/traffic.py: classify_bicycle_infrastructureが`shared_pedestrian`へ分類する
  # （分類ロジック自体はP0で実装済み、取込側が空だったため実データに出ていなかった）。
  - name: shared_pedestrian_ways
    element_type: way
    match:
      highway:
        - footway
        - path
      # "yes"はYAML 1.1のデフォルト解決規則でブール値として読まれてしまうため、
      # 文字列として保持するには引用符が必須（さもないとProfileErrorになる）。
      bicycle:
        - "yes"
        - designated
        - permissive
    target: osm_raw_ways
  # 静的道路属性P1（docs/static-road-attributes-plan.md）: 信号・横断歩道・一時停止。
  # highway=*とrailway=*は別タグキーのためOR条件になり、1ルールのANDマッチでは
  # 表現できない。踏切用に下のrailway_level_crossingルールを分けている。
  - name: stop_inducing_highway_nodes
    element_type: node
    match:
      highway:
        - traffic_signals
        - crossing
        - stop
        - give_way
    target: osm_raw_pois
  # 静的道路属性P1: 踏切。
  - name: railway_level_crossings
    element_type: node
    match:
      railway:
        - level_crossing
    target: osm_raw_pois
  # 改善計画T101（補給・休憩ポイントPOIレイヤー）: コンビニ。shopとamenityは別タグキーの
  # ためOR条件になり1ルールのANDマッチでは表現できず、下のsupply_amenity_nodesと分けている
  # （stop_inducing_highway_nodes/railway_level_crossingsと同じ理由）。
  - name: convenience_stores
    element_type: node
    match:
      shop:
        - convenience
    target: osm_raw_pois
  # 改善計画T101: 自販機・トイレ・給水・駐輪場。実店舗との乖離リスクを事前実測
  # （backend/scripts/measure_poi_freshness.py、2026-08-18）したところ、コンビニより
  # OSM側の最終編集が明確に古い（5年以上未編集が58〜59%）と判明したため、取込自体は
  # 5種すべて対象にしつつ、表示側で「鮮度に注意」と案内する方針にした
  # （domain/traffic.py: classify_supply_poi、frontend mapLayers.ts: supplyPoiのpanelHint）。
  - name: supply_amenity_nodes
    element_type: node
    match:
      amenity:
        - vending_machine
        - toilets
        - drinking_water
        - bicycle_parking
    target: osm_raw_pois
