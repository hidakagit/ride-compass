# 外部ソースの取込プロファイル。**取り込む母集団の宣言はここだけ**が持つ。
#
# 範囲を広げるときはこのファイルを変えて取り直す。実装には範囲を書かない。
# 適用した内容は取込のたびに source_runs.profile へ丸ごと記録されるため、
# 「どの範囲をどの絞り込みで取り込んだ行なのか」を後から引ける。
version: 1

# 全ソース共通の対象範囲。範囲はこの緯度経度の枠だけで決まる。
target:
  # 全ソースが取り込む範囲（min_lat, min_lon, max_lat, max_lon）。
  bbox: [34.9, 138.4, 37.2, 140.9]

sources:
  # --- OSM -----------------------------------------------------------------
  # 行は絞る（全種別を取ると全国で容量に収まらない）。**タグは絞らない**——
  # 実測でタグは容量の1.9%しか占めず、捨てると後から解釈を変えられなくなる。
  - name: osm_way
    adapter: osm_pbf_way
    rows:
      # どれか1つの条件に合うwayを採る。1つの条件の中はAND。
      any_of:
        # 地図表示とルート探索の少なくとも一方で使う種別。
        - highway:
            - trunk
            - trunk_link
            - primary
            - primary_link
            - secondary
            - secondary_link
            - tertiary
            - tertiary_link
            - unclassified
            - residential
            - living_street
            - cycleway
            - track
        # 上の種別に入らないが、自転車が実際に走る道（河川敷のサイクリングロード等）。
        - highway: [footway, path]
          bicycle: ["yes", designated, permissive]

  # wayが参照する頂点。位置だけでなくタグも持つ——POIかどうかの判定は派生側で行う。
  - name: osm_node
    adapter: osm_pbf_node
    rows:
      # どのwayの頂点を採るかは osm_way の絞り込みに従う（同じ条件を2度書かない）。
      referenced_by: osm_way

  # --- 年次の統計 -----------------------------------------------------------
  # 絞りは target.bbox で行う。行政区画で絞ると採番の異なるコード表（警察庁独自 vs JIS）の
  # 変換が要るが、母集団の指定としてはbboxで足りる。
  - name: accident
    adapter: npa_honhyo
    rows:
      years: [2024]

  # --- ラスタ ---------------------------------------------------------------
  # ズームは元データの分解能から導く。UIの都合で決めない。
  # 標高は製品ごとに、配信元が公表する最大ズームで取る（https://maps.gsi.go.jp/development/hyokochi.html）。
  # どの製品の値を採るかは画素ごとに派生が決める（順は dem_tile_store.PRODUCT_PRIORITY）。
  # DEM1Aを取らない理由は docs/modules/backend/elevation.md。
  - name: dem
    adapter: gsi_dem_tile
    grid:
      products:
        dem5a: 15          # 5mメッシュ（航空レーザ）。3.86 m/画素
        dem5b: 15          # 5mメッシュ（写真測量）
        dem5c: 15          # 5mメッシュ（写真測量）
        dem: 14            # 10mメッシュ（DEM10B）。7.73 m/画素

  - name: lulc
    adapter: io_lulc_tile
    grid:
      product: io-lulc-annual-v02
      year: 2024
      zoom: 14             # 7.73 m/画素。元データは10m画素

