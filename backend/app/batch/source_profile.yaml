# 外部ソースの取込プロファイル。**取り込む母集団の宣言はここだけ**が持つ。
#
# 範囲を広げるときはこのファイルを変えて取り直す。実装には範囲を書かない。
# 適用した内容は取込のたびに source_runs.profile へ丸ごと記録されるため、
# 「どの範囲をどの絞り込みで取り込んだ行なのか」を後から引ける。
version: 1

# 全ソース共通の対象範囲。範囲はこの緯度経度の枠だけで決まる。
target:
  # 全ソースが取り込む範囲（min_lat, min_lon, max_lat, max_lon）。
  bbox: [34.9, 138.4, 37.2, 140.9]

sources:
  # --- OSM -----------------------------------------------------------------
  # 行は絞る（全種別を取ると全国で容量に収まらない）。**タグは絞らない**——
  # 実測でタグは容量の1.9%しか占めず、捨てると後から解釈を変えられなくなる。
  - name: osm_way
    adapter: osm_pbf_way
    rows:
      # どれか1つの条件に合うwayを採る。1つの条件の中はAND。
      any_of:
        # 地図表示とルート探索の少なくとも一方で使う種別。
        - highway:
            - trunk
            - trunk_link
            - primary
            - primary_link
            - secondary
            - secondary_link
            - tertiary
            - tertiary_link
            - unclassified
            - residential
            - living_street
            - cycleway
            - track
        # 上の種別に入らないが、自転車が実際に走る道（河川敷のサイクリングロード等）。
        - highway: [footway, path]
          bicycle: ["yes", designated, permissive]

  # wayが参照する頂点。位置だけでなくタグも持つ——POIかどうかの判定は派生側で行う。
  - name: osm_node
    adapter: osm_pbf_node
    rows:
      # どのwayの頂点を採るかは osm_way の絞り込みに従う（同じ条件を2度書かない）。
      referenced_by: osm_way
      # 補給・休憩の点（コンビニ・自販機・トイレ等）は道から離れて置かれることが多いので、
      # 道の頂点でなくても採る。面で描かれたものは面の内側の1点にする。
      standalone_supply_poi: true

  # --- 年次の統計 -----------------------------------------------------------
  # 絞りは target.bbox で行う。行政区画で絞ると採番の異なるコード表（警察庁独自 vs JIS）の
  # 変換が要るが、母集団の指定としてはbboxで足りる。
  # 年は配布元が公開している全年。新しい年が公開されたらここへ足して取り直す。
  - name: accident
    adapter: npa_honhyo
    rows:
      years: [2019, 2020, 2021, 2022, 2023, 2024]

  # --- 地点 ---------------------------------------------------------------
  # 立ち寄り先とコンビニ。取り込むのはどれかの群に当たりうる地点だけ（群の語は domain/stop_place.py）。
  # 版を上げるときの手順は docs/architecture/data-sources.md「版を持つ配布物の入れ替え」。
  - name: overture_place
    adapter: overture_places
    rows:
      release: "2026-09-23.1"
      # 確からしさは地点が実在する見込み（0〜1）。閉じた地点は0になる。
      min_confidence: 0.5

  # 寺社。国の指定・登録の文化財の建造物（文化遺産オンラインをジャパンサーチで）。取得は全国で、範囲は取込が絞る。
  # 寺社かは所有者で派生が決める（domain/stop_place.py）。取り直しの手順は docs/architecture/data-sources.md「文化財の建造物」。
  - name: bunka_heritage
    adapter: bunka_heritages
    rows:
      snapshot: "2026-10-08"
      designations: ["国宝", "重要文化財", "登録有形文化財(建造物)"]

  # --- 住所 ---------------------------------------------------------------
  # 住所の区画（地点の検索・施設の辺り）の元データ。都道府県・市区町村は全国、町字は範囲に掛かる都道府県のものを入れ、
  # どの町字を区画にするかは派生が道路の取込の範囲で決める。取り直しの手順は docs/architecture/data-sources.md「住所の区画の元データ」。
  # アドレス・ベース・レジストリ（デジタル庁）。配布元は版を持たず今の全件を置くので、取った日で置き場を分ける。
  - name: abr
    adapter: abr
    rows:
      snapshot: "2026-10-09"

  # e-Stat の小地域の境界（令和2年国勢調査の町丁・字等）。施設と置いた位置の辺りを、点を含む境界の名前で決める。
  - name: estat_small_area
    adapter: estat_small_area
    rows:
      survey: "A002005212020"

  # 国土交通省の街区レベル位置参照情報（地番ごとの代表点）。住居表示の区域でない所で、番地まで打った住所を地番の点まで寄せる。
  # 版は配布元の置き場の名前（年に1度出る。https://nlftp.mlit.go.jp/isj/）。
  - name: isj_block
    adapter: isj_block
    rows:
      version: "24.0a"

  # --- ラスタ ---------------------------------------------------------------
  # ズームは元データの分解能から導く。UIの都合で決めない。
  # 標高は製品ごとに、配信元が公表する最大ズームで取る（https://maps.gsi.go.jp/development/hyokochi.html）。
  # どの製品の値を採るかは画素ごとに派生が決める（順は dem_tile_store.PRODUCT_PRIORITY）。
  # DEM1Aを取らない理由は docs/modules/backend/elevation.md。
  - name: dem
    adapter: gsi_dem_tile
    grid:
      products:
        dem5a: 15          # 5mメッシュ（航空レーザ）。3.86 m/画素
        dem5b: 15          # 5mメッシュ（写真測量）
        dem5c: 15          # 5mメッシュ（写真測量）
        dem: 14            # 10mメッシュ（DEM10B）。7.73 m/画素

  # どのラスタ（UTMゾーン・年）を読むかは環境変数 LULC_RASTER_PATHS が決める（地図のラスタタイルと共有）。
  - name: lulc
    adapter: io_lulc_tile
    grid:
      zoom: 14             # 7.73 m/画素。元データは10m画素

