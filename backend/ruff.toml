# backendのPython lint設定（pytest.iniと同じく、pyproject.tomlを持たずツールごとの
# 個別ファイルで持つ流儀に合わせる）。
#
# 選ぶルールはruffの既定（E4=import文の形式・E7=文の書き方・E9=構文/IOエラー・
# F=pyflakes）に絞る。既定より広げていないのは、実測した違反数が
# 「直す価値」に見合わないため:
#   E501（行長）4,488件 — 日本語コメントの折り返し位置の問題で、コードの欠陥ではない
#   ARG（未使用引数）300件 — Protocol実装・FastAPI依存性注入で意図的に受け取る引数が大半
#   I（import順）109ファイル — 全ファイルへ差分が出るのに対し、得られるのは並び順の統一だけ
# 実バグに近いルール群（B/SIM/C4等）は、既存違反を1件ずつ判断してから個別に足す。
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "TID253"]

# webアプリが読む層は`app.batch`をモジュール直下でimportしない（バッチ専用の重い依存を、それを
# 入れていない本番のwebが連鎖で引き込み、起動できなくなる）。関数の中へ遅延させたimportは許す
# ——層の向きを持つimport-linterは関数の中のimportも数え、直下だけを見る設定を持たない。
[lint.flake8-tidy-imports]
banned-module-level-imports = ["app.batch"]

[lint.per-file-ignores]
# TID253が見るのはwebアプリが読む層だけ（`app/batch`自身・道具・テストは除く）。
"!app/**" = ["TID253"]
"app/batch/**" = ["TID253"]
# rasterioより先にpin_bundled_proj_data()を呼ぶ必要があり、import順を動かせない
# （ファイル冒頭のコメント参照）。
"tests/conftest.py" = ["E402"]
