[pytest]
# 根の scripts/ の道具のテスト（scripts/tests/）。backend のテストとは別に、CI の scripts のジョブが回す（.github/workflows/ci.yml）。
testpaths = tests
pythonpath = tests
# 宣言していないマーカーは綴りの誤りとして収集時に止める（誤ったマーカーは黙って何も選ばない）。
addopts = --strict-markers
xfail_strict = true
empty_parameter_set_mark = fail_at_collect
# 警告は見えないと誰も直さないので、既定で落とす（.claude/rules/testing.md「警告は既定でエラー」）。
filterwarnings =
    error
